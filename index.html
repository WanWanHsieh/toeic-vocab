<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbf6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a2220" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="多益單字">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>多益單字通</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    color-scheme:light;
    --bg:#fbf6f1;
    --surface:#fffdfb;
    --surface-2:#f5ece3;
    --border:#eaddd0;
    --text:#3a2f2a;
    --text-muted:#8a7a6e;
    --accent:#b5694a;
    --accent-contrast:#ffffff;
    --accent-soft:#f9e6dc;
    --gold:#c58a2a;
    --gold-soft:#fbefd2;
    --danger:#cf5a5a;
    --danger-soft:#fbe3e1;
    --success:#4c9a79;
    --success-soft:#e2f2ea;
    --blue:#5f86b8;
    --blue-soft:#e5edf7;
    --shadow:0 1px 2px rgba(74,48,39,.05), 0 10px 26px -16px rgba(181,105,74,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#2a2220;
      --surface:#332927;
      --surface-2:#3d3230;
      --border:#524440;
      --text:#f3ebe6;
      --text-muted:#b9a99f;
      --accent:#e8a083;
      --accent-contrast:#3a1d12;
      --accent-soft:#4d372f;
      --gold:#e3b66e;
      --gold-soft:#4a3d22;
      --danger:#f09190;
      --danger-soft:#4d3130;
      --success:#7cc3a2;
      --success-soft:#2a433c;
      --blue:#8fb0dd;
      --blue-soft:#2f3c55;
      --shadow:0 1px 2px rgba(0,0,0,.22), 0 14px 28px -16px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#2a2220;
    --surface:#332927;
    --surface-2:#3d3230;
    --border:#524440;
    --text:#f3ebe6;
    --text-muted:#b9a99f;
    --accent:#e8a083;
    --accent-contrast:#3a1d12;
    --accent-soft:#4d372f;
    --gold:#e3b66e;
    --gold-soft:#4a3d22;
    --danger:#f09190;
    --danger-soft:#4d3130;
    --success:#7cc3a2;
    --success-soft:#2a433c;
    --blue:#8fb0dd;
    --blue-soft:#2f3c55;
    --shadow:0 1px 2px rgba(0,0,0,.22), 0 14px 28px -16px rgba(0,0,0,.45);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ text-wrap:balance; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace; }
  button{ font-family:inherit; }

  .app{ max-width:920px; margin:0 auto; padding:28px 20px 64px; }

  .top{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .kicker{ font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  .brand h1{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:700; font-size:clamp(26px,4vw,34px); margin:0; }
  .stats{ display:flex; gap:18px; font-family:"IBM Plex Mono", monospace; font-size:13px; color:var(--text-muted); }
  .stats b{ color:var(--text); font-size:16px; display:block; font-weight:600; }

  .tabs{ display:flex; gap:4px; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; width:max-content; max-width:100%; margin-bottom:16px; }
  .tab{ border:none; background:transparent; color:var(--text-muted); padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s,color .15s; white-space:nowrap; }
  .tab[aria-selected="true"]{ background:var(--accent); color:var(--accent-contrast); }
  .subtabs{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; }
  .subtab{ border:none; background:transparent; color:var(--text-muted); padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .subtab[aria-selected="true"]{ background:var(--accent); color:var(--accent-contrast); }
  .subtab:not([aria-selected="true"]):hover{ color:var(--text); }
  .tab:not([aria-selected="true"]):hover{ color:var(--text); }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:22px; }
  .controls input[type="search"]{
    flex:1 1 220px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 14px; border-radius:10px; font-size:14px;
  }
  .controls select{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px; max-width:180px;
  }
  .icon-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:9px 14px; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .controls label.chk{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); white-space:nowrap; }

  .stage{ min-height:360px; }

  /* Flashcard */
  .card-nav-row{ display:flex; justify-content:center; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
  .card-wrap{ perspective:1600px; max-width:560px; margin:0 auto; }
  .flashcard{
    position:relative; min-height:320px; border-radius:18px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .flashcard.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow);
    padding:26px 26px 20px; display:flex; flex-direction:column;
  }
  .face.back{ transform:rotateY(180deg); }
  .face::before{
    content:""; position:absolute; left:-9px; top:50%; width:18px; height:18px; border-radius:50%;
    background:var(--bg); border:1px solid var(--border); transform:translateY(-50%);
  }
  .face::after{
    content:""; position:absolute; right:-9px; top:50%; width:18px; height:18px; border-radius:50%;
    background:var(--bg); border:1px solid var(--border); transform:translateY(-50%);
  }
  .face-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .chip{ font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.06em; padding:4px 10px; border-radius:999px; text-transform:uppercase; }
  .chip.cat{ background:var(--gold-soft); color:var(--gold); }
  .chip.pos{ background:var(--accent-soft); color:var(--accent); }
  .chip.imp{ background:var(--surface-2); color:var(--text-muted); text-transform:none; }
  .word-block{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:18px 0; }
  .word{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:700; font-size:clamp(30px,5vw,42px); margin:0; }
  .ipa{ color:var(--accent); font-size:16px; }
  .speak-row{ display:flex; gap:10px; align-items:center; justify-content:center; }
  .speak-btn{
    background:var(--accent-soft); color:var(--accent); border:none; width:42px; height:42px; border-radius:50%;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s;
  }
  .speak-btn:hover{ transform:scale(1.08); }
  .speak-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .hint{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:auto; }
  .meaning{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:26px; font-weight:700; text-align:center; margin:0 0 14px; }
  .back-word{ display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; font-size:15px; font-weight:600; color:var(--text-muted); margin:16px 0 6px; }
  .back-word .ipa{ font-weight:400; }
  .example{ background:var(--surface-2); border-radius:12px; padding:14px 16px; font-size:14px; line-height:1.6; color:var(--text); display:flex; gap:10px; align-items:flex-start; }
  .example .txt{ font-style:italic; }
  .example .txt-zh{ color:var(--text-muted); font-style:normal; margin-top:4px; }

  .nav-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    width:44px; height:44px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  .nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .mark-row{ display:flex; justify-content:center; gap:10px; margin-top:16px; }
  .mark-btn{ border:1px solid var(--border); background:var(--surface); padding:9px 16px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text-muted); }
  .mark-btn.unknown.active{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .mark-btn.known.active{ background:var(--success-soft); border-color:var(--success); color:var(--success); }

  .progress-bar{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:22px; max-width:560px; margin-left:auto; margin-right:auto; }
  .progress-fill{ height:100%; background:var(--success); border-radius:999px; transition:width .3s; }

  /* List */
  .list{ display:flex; flex-direction:column; gap:8px; }
  .row{
    display:grid; grid-template-columns:1fr auto auto 44px 44px; gap:14px; align-items:start;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px;
  }
  .row .w{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:600; font-size:17px; }
  .row .ipa{ font-size:13px; margin-left:8px; }
  .row .meaning-inline{ color:var(--text-muted); font-size:13px; margin-top:2px; }
  .row .example-inline{ font-size:12.5px; margin-top:6px; line-height:1.5; }
  .row .example-inline .en{ font-style:italic; color:var(--text-muted); }
  .row .example-inline .zh{ color:var(--text-muted); }
  .row .cat-badge{ font-size:11px; color:var(--gold); font-family:"IBM Plex Mono",monospace; white-space:nowrap; padding-top:2px; }
  .row .speak-btn{ width:36px; height:36px; font-size:15px; }
  /* Below ~640px the fixed grid columns leave almost no room for the word/example text, forcing it to
     wrap into a cramped sliver. Switch to a wrapping flex row instead: the word block claims the full
     width of its own line, and the badge/status/buttons flow onto a second line beneath it. */
  @media (max-width:640px){
    .row{ display:flex; flex-wrap:wrap; align-items:center; }
    .row > div:first-child{ flex:1 0 100%; }
    .row .cat-badge{ margin-right:auto; }
  }
  .empty-state{ text-align:center; color:var(--text-muted); padding:60px 20px; font-size:14px; }
  .load-more-wrap{ display:flex; justify-content:center; padding:18px 0 6px; }
  .list-count{ text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:10px; font-family:"IBM Plex Mono",monospace; }

  /* Quiz */
  .quiz-card{ max-width:560px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:30px; text-align:center; }
  .quiz-score{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:14px; }
  .quiz-options{ display:grid; gap:10px; margin-top:22px; }
  .opt-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:13px 16px;
    border-radius:10px; font-size:15px; cursor:pointer; text-align:left; transition:background .12s,border-color .12s;
  }
  .opt-btn:hover:not(:disabled){ border-color:var(--accent); }
  .opt-btn.correct{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .opt-btn.wrong{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .opt-btn:disabled{ cursor:default; }
  .quiz-next{ margin-top:20px; }

  /* Spelling quiz */
  .spelling-input{
    width:100%; box-sizing:border-box; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:14px 16px; border-radius:10px; font-size:20px; text-align:center; font-family:"IBM Plex Mono",monospace;
    letter-spacing:.03em;
  }
  .spelling-input:focus{ outline:none; border-color:var(--accent); }
  .spelling-input:disabled{ opacity:.85; }
  .spelling-hint{ font-size:22px; letter-spacing:.12em; color:var(--text-muted); text-align:center; }
  .spelling-diff{ margin-top:10px; text-align:center; }
  .spelling-diff-ch{
    display:inline-block; min-width:1em; font-family:"IBM Plex Mono",monospace; font-size:22px;
    font-weight:700; padding:0 2px; border-bottom:3px solid transparent;
  }
  .spelling-diff-ch.ok{ color:var(--success); border-color:var(--success); }
  .spelling-diff-ch.bad{ color:var(--danger); border-color:var(--danger); }
  .spelling-feedback{ margin-top:16px; font-size:16px; font-weight:600; }
  .spelling-feedback.correct{ color:var(--success); }
  .spelling-feedback.wrong{ color:var(--danger); }

  /* Reading */
  .reading-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .reading-tag{ display:flex; gap:8px; align-items:center; }
  .reading-nav{ display:flex; gap:8px; align-items:center; font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text-muted); }
  .reading-layout{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:760px){ .reading-layout{ grid-template-columns:1fr; } }
  .doc-tabs{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .doc-tab{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); padding:6px 14px; border-radius:8px 8px 0 0; font-size:13px; font-weight:600; cursor:pointer; }
  .doc-tab[aria-selected="true"]{ background:var(--surface); color:var(--accent); border-bottom-color:var(--surface); }
  .doc-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:22px 24px; }
  .doc-title{ font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  .doc-meta{ display:flex; flex-direction:column; gap:2px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed var(--border); font-size:13.5px; }
  .doc-meta .row2{ display:flex; gap:6px; }
  .doc-meta .row2 .label{ color:var(--text-muted); min-width:60px; }
  .doc-para{ margin:0 0 12px; line-height:1.75; font-size:14.5px; white-space:pre-line; }
  .doc-para:last-child{ margin-bottom:0; }
  .doc-table-wrap{ overflow-x:auto; margin-top:10px; }
  .doc-table{ border-collapse:collapse; width:100%; font-size:13.5px; }
  .doc-table th, .doc-table td{ border:1px solid var(--border); padding:7px 10px; text-align:left; white-space:nowrap; }
  .doc-table th{ background:var(--surface-2); color:var(--text-muted); font-weight:600; }
  .questions-col{ display:flex; flex-direction:column; gap:16px; }
  .q-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .q-head{ font-weight:600; font-size:14.5px; margin-bottom:2px; }
  .q-opt{ display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:8px; font-size:13.5px; cursor:pointer; margin-bottom:7px; }
  .q-opt:last-child{ margin-bottom:0; }
  .q-opt[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .q-opt.correct{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .q-opt.wrong{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .q-opt:disabled{ cursor:default; }
  .q-explain{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; color:var(--text-muted); line-height:1.6; }
  .reading-actions{ display:flex; justify-content:center; gap:10px; margin-top:20px; }
  .reading-score{ text-align:center; font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text-muted); margin-top:14px; }

  /* Word detail panel under the flashcard */
  /* Word page (flashcard mode): one scrolling card + a sticky action bar */
  .wpg{ max-width:640px; margin:0 auto; }
  .wpg-card{ background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:22px 24px 8px; }
  .wpg-top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .wpg-tags{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .wpg-btns{ display:flex; gap:6px; flex:none; }
  .wpg-top .speak-btn{ width:30px; height:30px; font-size:14px; flex:none; }
  .wpg-card.zh-off .zhh:not(.shown){ filter:blur(7px); user-select:none; cursor:pointer; }
  .wpg-card .zhh{ transition:filter .15s; }
  .wpg-word{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:700; font-size:clamp(32px,6vw,44px); text-align:center; margin:14px 0 2px; word-break:break-word; }
  .wpg-ipa{ text-align:center; color:var(--accent); font-size:17px; }
  .wpg-audio{ display:flex; justify-content:center; gap:8px; margin:12px 0 4px; flex-wrap:wrap; }
  .wpg-meaning{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:24px; font-weight:700; text-align:center; margin:14px 0 10px; }
  .wpg-card .note-zh{ margin:0 0 6px; }
  .wpg-sec{ border-top:1px solid var(--border); margin-top:16px; padding:14px 0 6px; }
  .wpg-sec h4{ margin:0 0 10px; font-size:12.5px; letter-spacing:.06em; color:var(--text-muted); font-weight:600; }
  .wpg-grid{ display:grid; grid-template-columns:1fr; gap:0 24px; }
  @media (min-width:640px){ .wpg-grid{ grid-template-columns:1fr 1fr; } }
  .wpg-spk{ width:30px; height:30px; font-size:13px; flex:none; }
  .wpg-bar{ position:sticky; bottom:0; z-index:5; background:var(--bg); padding:10px 0 calc(12px + env(safe-area-inset-bottom)); margin-top:12px; }
  .wpg-bar .progress-bar{ margin:0 0 10px; max-width:none; }
  .wpg-bar-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .wpg-bar-row .mark-btn{ flex:1; max-width:140px; padding:10px 8px; white-space:nowrap; }
  .wpg-count{ color:var(--text-muted); font-size:12px; min-width:56px; text-align:center; }
  .wpg-bar-row .nav-btn{ flex:none; }
  @media (max-width:420px){ .wpg-card{ padding:18px 16px 6px; } .wpg-count{ min-width:0; font-size:11px; } .wpg-bar-row{ gap:6px; } }
  .wd-kkline{ text-align:center; color:var(--accent); font-size:18px; margin-bottom:6px; }
  .wd-chunks{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:8px 0 4px; }
  .wd-chunk{ display:flex; flex-direction:column; align-items:center; padding:6px 12px; border-radius:12px; border:2px solid transparent; min-width:46px; }
  .wd-letters{ font-size:26px; font-weight:700; line-height:1.15; }
  .wd-kk{ font-size:16px; margin-top:2px; min-height:1.4em; font-family:"IBM Plex Mono",monospace; }
  .wd-chunk.c0{ background:var(--blue-soft); color:var(--blue); }
  .wd-chunk.c1{ background:var(--gold-soft); color:var(--gold); }
  .wd-chunk.c2{ background:var(--success-soft); color:var(--success); }
  .wd-chunk.s1{ border-color:currentColor; }
  .wd-stress{ color:var(--danger); font-weight:700; }
  .wd-chunk.silent{ background:transparent; color:var(--text-muted); border:2px dashed var(--text-muted); }
  .wd-chunk.silent .wd-letters{ text-decoration:line-through; text-decoration-thickness:2px; }
  .wd-chunk.silent .wd-kk{ font-size:12px; }
  .wd-legend{ text-align:center; font-size:12px; color:var(--text-muted); margin:2px 0 10px; }
  .wd-audio{ display:flex; justify-content:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .wd-note{ background:var(--surface-2); border-radius:10px; padding:8px 12px; font-size:14px; margin:8px 0; line-height:1.6; }
  .wd-notes{ list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:14px; }
  .wd-notes li{ display:flex; gap:10px; align-items:center; }
  .wd-chunk.wd-tag{ display:inline-block; flex:none; padding:0 8px; min-width:48px; font-size:14px; font-weight:700; text-align:center; border-radius:8px; border-width:1px; }
  .wd-sense{ margin-bottom:12px; }
  .wd-sense-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .wd-sense-zh{ font-size:18px; font-weight:700; }
  .wd-example{ background:var(--surface-2); border-radius:10px; padding:10px 12px; display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.55; }
  .wd-example .en{ font-style:italic; }
  .wd-example .zh{ color:var(--text-muted); margin-top:2px; }
  .wd-kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:14.5px; align-items:baseline; }
  .wd-kv .k{ color:var(--text-muted); }
  .wd-kv .muted{ color:var(--text-muted); }
  .wd-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .wd-chip{ font-size:14px; padding:3px 11px; border-radius:999px; background:var(--surface-2); color:var(--text); border:0; font-family:inherit; }
  button.wd-chip{ cursor:pointer; }
  button.wd-chip:hover{ background:var(--accent-soft); }
  .wd-p{ margin:0 0 8px; font-size:14px; line-height:1.6; }
  .wd-callout{ border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.65; }
  .wd-callout.root{ background:var(--success-soft); }
  .wd-callout.tip{ background:var(--gold-soft); }
  .wd-callout + .wd-callout{ margin-top:8px; }

  /* Grammar lessons */
  .lesson-title{ margin-bottom:6px; }
  .lesson-title-zh{ font-size:24px; font-weight:700; }
  .lesson-title-en{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--text-muted); letter-spacing:.04em; }
  .lesson-summary{ margin:8px 0 18px; font-size:14.5px; line-height:1.7; color:var(--text-muted); }
  .lesson-label{ font-weight:700; font-size:13px; letter-spacing:.04em; color:var(--accent); margin:22px 0 10px; }
  .lesson-sec{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px; }
  .lesson-h{ font-weight:700; font-size:15.5px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
  .lesson-num{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); font-size:12px; font-family:"IBM Plex Mono",monospace; flex:none; }
  .lesson-p{ margin:0 0 6px; font-size:14.5px; line-height:1.75; }
  .lesson-ex{ background:var(--surface-2); border-radius:10px; padding:10px 12px; margin-top:8px; display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.55; }
  .lesson-ex .en{ font-style:italic; }
  .lesson-ex .zh{ color:var(--text-muted); margin-top:2px; }
  .en-term{ color:var(--accent); font-weight:700; }
  mark.hl{ background:color-mix(in srgb, var(--gold) 38%, transparent); color:var(--text); font-weight:700; font-style:normal; border-radius:4px; padding:1px 4px; box-shadow:inset 0 -2px 0 var(--gold); }
  mark.hl.bad{ background:color-mix(in srgb, var(--danger) 24%, transparent); color:var(--danger); box-shadow:none; text-decoration:line-through; text-decoration-thickness:1.5px; }
  mark.hl.good{ background:color-mix(in srgb, var(--success) 24%, transparent); color:var(--success); box-shadow:none; }
  .lesson-trap{ border-left:3px solid var(--danger); background:var(--danger-soft); border-radius:6px; padding:10px 12px; margin-bottom:8px; font-size:14px; line-height:1.65; }
  .lesson-tip{ background:var(--accent-soft); border-radius:10px; padding:12px 14px; font-size:14.5px; line-height:1.7; }
  .p5-filter-banner{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; background:var(--accent-soft); border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:13.5px; }
  .p5-filter-banner span{ margin-right:auto; font-weight:600; }

  /* Story reading (導讀) */
  .story-guide{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .story-guide-head{ font-weight:700; font-size:13px; letter-spacing:.04em; color:var(--accent); margin-bottom:8px; }
  .story-guide-intro{ margin:0 0 14px; font-size:14px; line-height:1.7; color:var(--text); }
  .story-vocab-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; }
  .story-vocab-item{ background:var(--surface-2); border-radius:8px; padding:8px 10px; font-size:13px; }
  .story-vocab-item .w-row{ display:flex; align-items:center; gap:6px; }
  .story-vocab-item .w{ font-weight:700; font-family:"IBM Plex Mono",monospace; }
  .story-vocab-item .ipa{ font-size:11.5px; }
  .story-vocab-item .speak-btn{ width:22px; height:22px; font-size:10px; flex:none; margin-left:auto; }
  .story-vocab-item .m{ color:var(--text-muted); display:block; margin-top:2px; }
  .story-summary p{ margin:0; font-size:14px; line-height:1.7; color:var(--text); }
  .story-para-block{ margin-bottom:18px; }
  .story-para-block:last-child{ margin-bottom:0; }
  .story-para-row{ display:flex; gap:10px; align-items:flex-start; }
  .story-para-row .doc-para{ flex:1; margin:0; }
  .doc-para-zh{ margin:6px 0 0 40px; font-size:13.5px; line-height:1.65; color:var(--text-muted); }

  /* Grammar (Part 5/6) */
  .p5-card{ max-width:640px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:28px; }
  .p5-cat{ margin-bottom:14px; }
  .p5-sentence{ font-size:17px; line-height:1.8; margin-bottom:22px; }
  .p5-blank{ display:inline-block; min-width:70px; border-bottom:2px solid var(--accent); color:var(--accent); font-weight:600; text-align:center; }
  .p5-options{ display:grid; gap:10px; }
  .blank-marker{ display:inline-flex; align-items:center; justify-content:center; min-width:34px; padding:1px 6px; border-radius:6px; background:var(--gold-soft); color:var(--gold); font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:12.5px; }
  .blank-marker.answered-correct{ background:var(--success-soft); color:var(--success); }
  .blank-marker.answered-wrong{ background:var(--danger-soft); color:var(--danger); }
  .p6-blank-label{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--gold); font-weight:700; margin-bottom:4px; }

  /* Listening (Part 2/3/4) */
  .listen-card{ max-width:640px; margin:0 auto; }
  .listen-play-row{ display:flex; justify-content:center; margin-bottom:22px; }
  .big-play-btn{ background:var(--accent); color:var(--accent-contrast); border:none; padding:16px 30px; border-radius:999px; font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .big-play-btn:disabled{ opacity:.55; cursor:default; }
  .transcript-toggle{ text-align:center; margin-bottom:16px; }
  .transcript-toggle button{ background:none; border:none; color:var(--text-muted); text-decoration:underline; font-size:12.5px; cursor:pointer; }
  .transcript-box{ background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-bottom:18px; font-size:13.5px; line-height:1.7; }
  .transcript-line{ margin-bottom:6px; }
  .transcript-line b{ color:var(--gold); }
  .p2-option-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .p2-option-row .q-opt{ flex:1; margin-bottom:0; }
  .mini-speak-btn{ background:var(--accent-soft); color:var(--accent); border:none; width:34px; height:34px; border-radius:50%; font-size:14px; cursor:pointer; flex:none; }

  /* Part 1 photo-description scenes */
  .p1-scene-wrap{ max-width:420px; margin:0 auto 6px; border-radius:14px; overflow:hidden; border:1px solid var(--border); box-shadow:var(--shadow); }
  .p1-scene-wrap svg{ display:block; width:100%; height:auto; }
  .p1-scene-wrap img{ display:block; width:100%; max-height:420px; object-fit:contain; background:var(--surface-2); }
  .p1-credit{ max-width:420px; margin:0 auto 18px; text-align:right; font-size:11px; color:var(--text-muted); }
  .p1-credit a{ color:var(--text-muted); }
  .p1-bg{ fill:var(--surface-2); }
  .p1-fill{ fill:var(--text-muted); }
  .p1-accent{ fill:var(--gold); }
  .p1-stroke{ stroke:var(--text-muted); stroke-width:6; stroke-linecap:round; fill:none; }

  .lookup-word{ cursor:pointer; border-bottom:1px dotted var(--accent); }
  .lookup-word:hover{ background:var(--accent-soft); border-bottom-style:solid; }

  .wp-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .wp-overlay.open{ display:flex; }
  .wp-card{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:26px; max-width:360px; width:100%; max-height:80vh; overflow-y:auto; }
  .wp-close{ position:absolute; top:10px; right:12px; background:none; border:none; font-size:22px; line-height:1; color:var(--text-muted); cursor:pointer; }
  .wp-word{ font-size:24px; font-weight:700; margin:0 0 6px; padding-right:24px; }
  .wp-ipa{ color:var(--accent); font-size:15px; margin-bottom:10px; }
  .wp-pos{ display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase; background:var(--accent-soft); color:var(--accent); padding:3px 9px; border-radius:999px; margin-bottom:10px; }
  .wp-meaning{ font-size:18px; font-weight:600; margin-bottom:12px; }
  .wp-example{ background:var(--surface-2); border-radius:10px; padding:12px 14px; font-size:13.5px; line-height:1.6; }
  .wp-example .zh{ color:var(--text-muted); margin-top:4px; }
  .wp-note{ margin-top:12px; font-size:11.5px; color:var(--text-muted); }
  .note-zh{ margin-top:10px; font-size:13px; line-height:1.6; color:var(--text-muted); }
  .wp-loading{ text-align:center; color:var(--text-muted); padding:20px 0; }

  /* TOEIC hub (generation picker -> Part picker) */
  .hub-list{ display:grid; gap:12px; max-width:640px; margin:0 auto; }
  .hub-card{ display:block; width:100%; text-align:left; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:18px 20px; cursor:pointer; box-shadow:var(--shadow); }
  .hub-card:hover{ border-color:var(--accent); }
  .hub-card-title{ font-size:17px; font-weight:700; margin-bottom:4px; }
  .hub-card-sub{ font-size:13px; color:var(--text-muted); font-family:"IBM Plex Mono",monospace; }
  .hub-card-bar{ margin-top:10px; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
  .hub-card-bar-fill{ height:100%; background:var(--success); border-radius:999px; }
  .hub-intro{ text-align:center; color:var(--text-muted); font-size:13px; margin-bottom:16px; }

  /* Saved words (collected from the word-lookup popup) */
  .saved-word-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .saved-word-head .word-card-word{ font-size:18px; font-weight:700; }
  .saved-word-head .speak-btn{ width:30px; height:30px; font-size:12px; }
  .saved-word-head .unsave-btn{ margin-left:auto; }

  footer.note{ text-align:center; color:var(--text-muted); font-size:12px; margin-top:36px; }

  @media (prefers-reduced-motion: reduce){
    .flashcard, .speak-btn, .progress-fill{ transition:none !important; }
  }

  .auth-bar{ display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:6px; font-size:13px; color:var(--text-muted); }
  .auth-user{ display:flex; align-items:center; gap:8px; }
  .auth-avatar{ width:24px; height:24px; border-radius:50%; }
  .auth-btn{ background:var(--accent); color:var(--accent-contrast); border:none; padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
  .auth-btn.secondary{ background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }
  .sync-note{ font-family:"IBM Plex Mono",monospace; font-size:11px; }

  /* ================= Design theme (home + flashcards) ================= */
  :root{ --sans:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
         --hero-a:#f6cdb8; --hero-b:#f9e1c2; --on-hero:#4a3027; --on-hero-soft:rgba(74,48,39,.72); --hero-gold:#9c5426; --rule:var(--border);
         --chip-bg:rgba(255,255,255,.55); --chip-bg-h:rgba(255,255,255,.82); --hero-ring:rgba(74,48,39,.16); --hero-ipa-bg:rgba(255,255,255,.62);
         --hero-glow:rgba(255,255,255,.7); --hero-glow-ring:rgba(255,255,255,.45);
         --hbtn-bg:#b5694a; --hbtn-fg:#ffffff; --hbtn-bg-h:#a15c3f; --hbtn2-bg:rgba(255,255,255,.62); --hbtn2-fg:#6b4030; --hbtn2-bg-h:rgba(255,255,255,.9); }
  :root[data-theme="dark"]{
      --hero-a:#5f3d33; --hero-b:#77503f; --on-hero:#fff1e8; --on-hero-soft:rgba(255,241,232,.72); --hero-gold:#f0c79a;
      --chip-bg:rgba(255,255,255,.14); --chip-bg-h:rgba(255,255,255,.24); --hero-ring:rgba(255,255,255,.25); --hero-ipa-bg:rgba(0,0,0,.22);
      --hero-glow:rgba(255,200,150,.2); --hero-glow-ring:rgba(255,255,255,.07);
      --hbtn-bg:#f1d3c0; --hbtn-fg:#4a2c20; --hbtn-bg-h:#fbe6d8; --hbtn2-bg:rgba(255,255,255,.16); --hbtn2-fg:#fff1e8; --hbtn2-bg-h:rgba(255,255,255,.28); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
      --hero-a:#5f3d33; --hero-b:#77503f; --on-hero:#fff1e8; --on-hero-soft:rgba(255,241,232,.72); --hero-gold:#f0c79a;
      --chip-bg:rgba(255,255,255,.14); --chip-bg-h:rgba(255,255,255,.24); --hero-ring:rgba(255,255,255,.25); --hero-ipa-bg:rgba(0,0,0,.22);
      --hero-glow:rgba(255,200,150,.2); --hero-glow-ring:rgba(255,255,255,.07);
      --hbtn-bg:#f1d3c0; --hbtn-fg:#4a2c20; --hbtn-bg-h:#fbe6d8; --hbtn2-bg:rgba(255,255,255,.16); --hbtn2-fg:#fff1e8; --hbtn2-bg-h:rgba(255,255,255,.28); } }
  body{ font-family:var(--sans); font-weight:400; background-image:radial-gradient(1000px 420px at 85% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%); background-attachment:fixed; }
  html,body{ overflow-x:clip; }
  b,strong{ font-weight:700; }
  .app{ padding-top:16px; }

  /* hero header */
  .top{ position:relative; overflow:visible; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:nowrap;
        padding:20px 22px 40px; margin-bottom:0; border-radius:24px; color:var(--on-hero);
        background:radial-gradient(circle at 94% -6%, var(--hero-glow), transparent 34%), radial-gradient(circle at 82% 112%, transparent 52px, var(--hero-glow-ring) 53px, var(--hero-glow-ring) 78px, transparent 79px), linear-gradient(135deg,var(--hero-a),var(--hero-b)); box-shadow:0 18px 36px -22px rgba(181,105,74,.30); }
  .brand{ position:relative; z-index:1; min-width:0; }
  .brand .kicker{ font-family:var(--sans); font-weight:700; font-size:10.5px; letter-spacing:.24em; color:var(--hero-gold); }
  .brand h1{ font-family:var(--sans); font-weight:800; font-size:clamp(28px,6.5vw,40px); letter-spacing:.02em; line-height:1.15; margin:4px 0 14px; white-space:nowrap; color:var(--on-hero); }
  .mast-stats{ display:flex; gap:22px; font-size:12px; color:var(--on-hero-soft); }
  .mast-stats span{ display:flex; flex-direction:column; gap:1px; line-height:1.2; }
  .mast-stats b{ font-size:22px; font-weight:800; color:var(--on-hero); letter-spacing:-.01em; }
  .mast-stats i{ display:none; }
  .top-right{ position:relative; z-index:20; display:flex; align-items:center; gap:10px; flex:none; }
  .goal{ display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; background:var(--chip-bg); border-radius:999px; padding:5px 14px 5px 5px; }
  .goal:hover{ background:var(--chip-bg-h); }
  .goal-ring{ width:38px; height:38px; transform:rotate(-90deg); flex:none; }
  .goal-ring circle{ fill:none; stroke-width:4; }
  .goal-ring .bg{ stroke:var(--hero-ring); }
  .goal-ring .fg{ stroke:var(--accent); stroke-linecap:round; stroke-dasharray:113.1; stroke-dashoffset:113.1; transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1), stroke .3s; }
  .goal.done .goal-ring .fg{ stroke:var(--success); }
  .goal-text{ display:flex; flex-direction:column; line-height:1.2; }
  .goal-text b{ font-size:15px; font-weight:800; color:var(--on-hero); }
  .goal-text span{ font-size:10.5px; color:var(--on-hero-soft); letter-spacing:.06em; }
  .menu-btn{ width:38px; height:38px; border-radius:50%; border:0; background:var(--chip-bg); color:var(--on-hero); font-size:16px; cursor:pointer; line-height:1; }
  .menu-btn:hover{ background:var(--chip-bg-h); }
  .menu-pop{ position:absolute; right:0; top:48px; z-index:60; min-width:240px; display:flex; flex-direction:column; align-items:stretch; gap:8px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:10px; box-shadow:0 18px 40px -16px rgba(0,0,0,.4); }
  .menu-pop[hidden]{ display:none; }
  .menu-pop .auth-btn{ width:100%; text-align:center; }
  .menu-pop .auth-user{ justify-content:center; }
  .menu-pop .sync-note{ text-align:center; }

  /* main navigation: floating segmented bar overlapping the hero */
  .subtabs, .tabs{ border-radius:0; width:auto; max-width:100%; }
  #categoryTabs{ position:relative; z-index:3; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:-24px 14px 14px !important; padding:5px; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:0 12px 26px -14px rgba(181,105,74,.20); }
  .subtab{ border:0; background:transparent; border-radius:13px; padding:10px 4px; font-family:var(--sans); font-size:14.5px; font-weight:700; color:var(--text-muted); text-align:center; white-space:nowrap; }
  .subtab:hover{ color:var(--text); background:var(--surface-2); }
  .subtab[aria-selected="true"]{ background:var(--accent); color:var(--accent-contrast); box-shadow:0 6px 14px -8px var(--accent); }
  .tabs{ background:transparent; border:0; padding:0; gap:6px; margin-bottom:14px; }
  .tab{ border-radius:999px; padding:6px 14px; font-size:13px; font-weight:600; background:var(--surface); border:1px solid var(--border); color:var(--text-muted); }
  .tab[aria-selected="true"]{ background:var(--accent-soft); color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, transparent); font-weight:700; }
  .tab:not([aria-selected="true"]):hover{ color:var(--text); border-color:var(--text-muted); }

  /* search + folded filters */
  #vocabControls{ gap:8px; margin-bottom:18px; align-items:stretch; }
  #vocabControls input[type="search"]{ flex:1 1 200px; border-radius:14px; padding:11px 16px; background:var(--surface); border:1px solid var(--border); font-family:var(--sans); }
  #vocabControls input[type="search"]:focus{ outline:2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color:var(--accent); }
  .filter-toggle{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:14px; padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .filter-toggle:hover, .filter-toggle[aria-expanded="true"]{ border-color:var(--accent); color:var(--accent); }
  .filter-toggle .sum{ color:var(--text-muted); font-weight:500; font-size:12.5px; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
  .filter-panel{ flex:1 1 100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; box-shadow:var(--shadow); }
  .filter-panel[hidden]{ display:none; }
  .filter-panel label.f{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--text-muted); font-weight:700; }
  .filter-panel label.f select{ max-width:none; width:100%; }
  .filter-panel .chk, .filter-panel .filter-actions{ grid-column:1 / -1; }
  .filter-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* flashcard page */
  @keyframes wpgIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .wpg{ max-width:620px; }
  .wpg-card{ padding:0; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:24px; box-shadow:0 22px 44px -26px rgba(181,105,74,.22); animation:wpgIn .25s ease-out; }
  .wpg-hero{ position:relative; overflow:hidden; padding:18px 22px 24px; color:var(--on-hero); text-align:center; background:linear-gradient(150deg,var(--hero-a),var(--hero-b)); }

/* Position-by-position comparison of what the user typed against the correct spelling —
   green for letters that are right, red for letters that are wrong (or missing/extra),
   so the user can see exactly what to fix instead of just being told "wrong". */
function spellingDiffHtml(attempt, correct){
  const a = attempt.trim();
  const c = correct.trim();
  const len = Math.max(a.length, c.length);
  let html = "";
  for(let i=0;i<len;i++){
    const ac = a[i] || "";
    const cc = c[i] || "";
    const ok = ac !== "" && ac.toLowerCase() === cc.toLowerCase();
    html += `<span class="spelling-diff-ch ${ok?'ok':'bad'}">${ac || "_"}</span>`;
  }
  return html;
}
/* Renders the word as spaced-out letters/blanks, e.g. "a d _ _ _ _ _ _ _ _" — non-letter
   characters (spaces, hyphens) always show through so multi-word entries stay readable. */
function spellingHintDisplay(word, n){
  let shown = 0;
  return word.split("").map(ch=>{
    if(/[a-zA-Z]/.test(ch)){
      shown++;
      return shown <= n ? ch : "_";
    }
    return ch;
  }).join(" ");
}
function spellingMaxHint(word){
  const letters = word.replace(/[^a-zA-Z]/g, "").length;
  return Math.max(0, letters - 1); // never reveal the very last letter via hint
}

/* ---------- Content versioning ----------
   Each part's data file has a version tag in data/content_versions.json. Progress is stored
   alongside the version it was recorded against; if the content for a part is later regenerated
   (a new version), old right/wrong records for that part are treated as stale and not reused —
   they simply don't apply to content the user hasn't actually seen, instead of silently mismatching. */
/* All content for one "generation" lives together under data/<version>/ (e.g. data/2026-09-03/part1.json,
   .../toeic_vocab.json, .../images/...). Regenerating content later means adding a NEW dated folder and
   bumping this pointer — the old folder (and any progress recorded against it) is simply left behind,
   never touched or merged into the new generation. */
let currentVersion = "v1";
let currentVersionPromise = null;
/* Shared/deduped: whichever loader calls this first triggers the one fetch; everyone else awaits the same
   promise, so every loader is guaranteed a resolved currentVersion before building its data path — no matter
   what order loadVocab()/loadReading()/loadP1()..loadP6()/initAllProgress() happen to fire in. */
let allVersions = [];
function ensureCurrentVersion(){
  if(!currentVersionPromise){
    currentVersionPromise = fetch("data/current_version.json")
      .then(res => res.ok ? res.json() : null)
      .then(d => {
        currentVersion = (d && d.version) || "v1";
        allVersions = (d && d.all_versions && d.all_versions.length) ? d.all_versions : [currentVersion];
      })
      .catch(()=>{ currentVersion = "v1"; allVersions = ["v1"]; });
  }
  return currentVersionPromise;
}
function versionOf(part){ return currentVersion; }
function dataPath(relPath){ return `data/${currentVersion}/${relPath}`; }

function loadVersionedProgress(key, version){
  const raw = loadJSON(key);
  if(!raw || typeof raw !== "object") return {};
  if("version" in raw) return (raw.version === version && raw.data) ? raw.data : {};
  // Legacy data saved before content-versioning existed (a flat {id: status} map, no wrapper) —
  // treat it as belonging to today's baseline version so this migration doesn't wipe existing progress.
  return raw;
}
function saveVersionedProgress(key, version, dataObj){
  saveJSON(key, { version, data: dataObj });
}

/* Item counts per version, for showing progress on generations that aren't the active one (fetched lazily and cached). */
let versionCountsCache = {};
async function versionItemCounts(version){
  if(versionCountsCache[version]) return versionCountsCache[version];
  const files = {p1:"part1.json", p2:"part2.json", p3:"part3.json", p4:"part4.json", p5:"part5.json", p6:"part6.json", p7:"toeic_reading.json"};
  const counts = {};
  await Promise.all(Object.entries(files).map(async ([key, file])=>{
    try{
      const res = await fetch(`data/${version}/${file}`);
      const data = res.ok ? await res.json() : [];
      counts[key] = Array.isArray(data) ? data.length : 0;
    }catch(e){ counts[key] = 0; }
  }));
  versionCountsCache[version] = counts;
  return counts;
}
const PART_PROGRESS_KEYS = {p1:"toeic-p1-progress", p2:"toeic-p2-progress", p3:"toeic-p3-progress", p4:"toeic-p4-progress", p5:"toeic-p5-progress", p6:"toeic-p6-progress", p7:"toeic-reading-checked"};
async function generationProgressSummary(version){
  if(version === currentVersion){
    let done = 0, total = 0;
    TOEIC_PARTS.forEach(p=>{ const s = partProgressSummary(p.key); done += s.done; total += s.total; });
    return {done, total};
  }
  const counts = await versionItemCounts(version);
  let done = 0, total = 0;
  TOEIC_PARTS.forEach(p=>{
    const t = counts[p.key] || 0;
    total += t;
    const prog = loadVersionedProgress(PART_PROGRESS_KEYS[p.key], version);
    done += Object.values(prog).filter(v => v === "correct" || v === "wrong").length;
  });
  return {done, total};
}

  if(newVersion === currentVersion) return;
  currentVersion = newVersion;

  cursor = 0; flipped = false; listPage = 1; quizWord = null;
  p1Order = []; p1Idx = 0; p1Selected = null; p1Checked = false; p1ShowText = false;
  p2Order = []; p2Idx = 0; p2Selected = null; p2Checked = false; p2ShowText = false;
  p3Order = []; p3Idx = 0; p3Selected = {}; p3Checked = false; p3ShowText = false;
  p4Order = []; p4Idx = 0; p4Selected = {}; p4Checked = false; p4ShowText = false;
  p5Order = []; p5Idx = 0; p5Selected = null; p5Checked = false;
  p6Order = []; p6Idx = 0; p6Selected = {}; p6Checked = false;
  readingIdx = 0; readingOrder = []; readingDocTab = {};

  progress = loadVersionedProgress("toeic-vocab-progress", newVersion);
  readingAnswers = loadVersionedProgress("toeic-reading-answers", newVersion);
  readingChecked = loadVersionedProgress("toeic-reading-checked", newVersion);
  p5Progress = loadVersionedProgress("toeic-p5-progress", newVersion);

  p1Progress = loadVersionedProgress("toeic-p1-progress", newVersion);

  p3Progress = loadVersionedProgress("toeic-p3-progress", newVersion);

}

/* progressObj values are "correct" | "wrong" (older data may just be `true`, treated as "done" but not "wrong"). */
function filterByMode(items, progressObj, mode){
  if(mode === "unfinished") return items.filter(it => !progressObj[it.id]);
  if(mode === "wrong") return items.filter(it => progressObj[it.id] === "wrong");
  return items;
}
function wrongCount(items, progressObj){
  return items.filter(it => progressObj[it.id] === "wrong").length;
}

/* Union-merge: keep every key from either side; on conflict, local (this device's current in-memory state) wins,
   since it's always at least as fresh as whatever we last managed to push. This guarantees a cloud sync can
   only ADD progress, never silently erase progress made locally before the cloud copy was written. */
function mergeProgress(cloudMap, localMap){
  return { ...(cloudMap||{}), ...(localMap||{}) };
}
/* Only merge in a cloud record if it was recorded against the SAME content version we're currently showing —
   a cloud record from a since-regenerated version of a part's content is discarded rather than merged in,
   so old right/wrong marks never get misapplied to different questions that happen to share the same index. */
function mergeVersioned(cloudEntry, localVal, part){
  if(!cloudEntry) return localVal;
  if("version" in cloudEntry) return cloudEntry.version === versionOf(part) ? mergeProgress(cloudEntry.progress, localVal) : localVal;
  // Legacy cloud doc written before content-versioning existed (a flat progress map, no wrapper) —
  // treat it as belonging to today's baseline version so this migration doesn't wipe synced progress.
  return mergeProgress(cloudEntry, localVal);
}

window.addEventListener("cloud-auth-changed", async (e)=>{
  currentUser = e.detail.user;
  renderAuthBar();
  if(!currentUser || !window.cloudSync) return;
  try{
    cloudSyncing = true;
    await ensureCurrentVersion(); // make sure we know current versions before comparing
    const cloud = await window.cloudSync.loadProgress(currentUser.uid);

    progress = mergeVersioned(cloud.vocab, progress, "vocab");
    saveVersionedProgress("toeic-vocab-progress", versionOf("vocab"), progress);

    const readingVersionOk = cloud.reading && (!("version" in cloud.reading) || cloud.reading.version === versionOf("reading"));
    if(readingVersionOk){
      readingChecked = mergeProgress(cloud.reading.checked, readingChecked);
      readingAnswers = { ...(cloud.reading.answers||{}), ...readingAnswers };
    }
    saveVersionedProgress("toeic-reading-answers", versionOf("reading"), readingAnswers);
    saveVersionedProgress("toeic-reading-checked", versionOf("reading"), readingChecked);

    p5Progress = mergeVersioned(cloud.p5, p5Progress, "p5"); saveVersionedProgress("toeic-p5-progress", versionOf("p5"), p5Progress);
    p6Progress = mergeVersioned(cloud.p6, p6Progress, "p6"); saveVersionedProgress("toeic-p6-progress", versionOf("p6"), p6Progress);
    p1Progress = mergeVersioned(cloud.p1, p1Progress, "p1"); saveVersionedProgress("toeic-p1-progress", versionOf("p1"), p1Progress);
    p2Progress = mergeVersioned(cloud.p2, p2Progress, "p2"); saveVersionedProgress("toeic-p2-progress", versionOf("p2"), p2Progress);
    p3Progress = mergeVersioned(cloud.p3, p3Progress, "p3"); saveVersionedProgress("toeic-p3-progress", versionOf("p3"), p3Progress);
    p4Progress = mergeVersioned(cloud.p4, p4Progress, "p4"); saveVersionedProgress("toeic-p4-progress", versionOf("p4"), p4Progress);

    savedWords = mergeProgress(cloud.savedWords, savedWords);
    saveJSON("toeic-saved-words", savedWords);

    /* Daily-reading progress isn't version-gated like p1-p7 — it's keyed by date string,
       which is globally unique regardless of which content generation happens to be active. */
    if(cloud.dailyReading){
      dailyChecked = mergeProgress(cloud.dailyReading.checked, dailyChecked);
      dailyAnswers = { ...(cloud.dailyReading.answers||{}), ...dailyAnswers };
    }
    saveJSON("toeic-daily-answers", dailyAnswers);
    saveJSON("toeic-daily-checked", dailyChecked);

    const storyVersionOk = cloud.story && (!("version" in cloud.story) || cloud.story.version === versionOf("story"));
    if(storyVersionOk){
      storyChecked = mergeProgress(cloud.story.checked, storyChecked);
      storyAnswers = { ...(cloud.story.answers||{}), ...storyAnswers };
    }
    saveVersionedProgress("toeic-story-answers", versionOf("story"), storyAnswers);
    saveVersionedProgress("toeic-story-checked", versionOf("story"), storyChecked);

    /* Card/quiz position aren't maps to union-merge — they're "where was I", a single spot.
       Whichever device touched it most recently (by timestamp) wins, so switching devices
       resumes wherever you actually left off last, not always word 1 on a fresh device. */
    const localCardPos = loadCardPosition();
    const cloudCardPos = (cloud.cardPos && typeof cloud.cardPos.id === "number") ? cloud.cardPos : null;
    const winningCardPos = (cloudCardPos && (!localCardPos || cloudCardPos.updatedAt > localCardPos.updatedAt)) ? cloudCardPos : localCardPos;
    if(winningCardPos){
      const { map: _ignored, ...lastPos } = winningCardPos;
      saveJSON("toeic-card-pos", lastPos);
    }
    // per-filter spots: keep, for every filter combination, whichever side moved most recently
    const mergedMap = { ...loadCardPosMap() };
    const cloudMap = (cloud.cardPos && cloud.cardPos.map && typeof cloud.cardPos.map === "object") ? cloud.cardPos.map : {};
    for(const [k, v] of Object.entries(cloudMap)){
      if(v && typeof v.id === "number" && (!mergedMap[k] || v.updatedAt > mergedMap[k].updatedAt)) mergedMap[k] = v;
    }
    if(Object.keys(mergedMap).length === 0 && winningCardPos) mergedMap[cardFilterKey()] = { id: winningCardPos.id, updatedAt: winningCardPos.updatedAt };
    saveJSON("toeic-card-pos-map", mergedMap);
    if(order.length) restoreCardForCurrentFilter();

    const localQuizRaw = loadJSON("toeic-quiz-pos");
    const localQuizPos = (localQuizRaw && typeof localQuizRaw.id === "number") ? localQuizRaw : null;
    const cloudQuizPos = (cloud.quizPos && typeof cloud.quizPos.id === "number") ? cloud.quizPos : null;
    const winningQuizPos = (cloudQuizPos && (!localQuizPos || cloudQuizPos.updatedAt > localQuizPos.updatedAt)) ? cloudQuizPos : localQuizPos;
    if(winningQuizPos && progress[winningQuizPos.id] !== undefined){
      pickQuizWord(winningQuizPos.id);
    }

    cloudSyncing = false;
    // Always push the merged (union) result back up so the cloud copy converges too, not just on first sync.
    pushCloudVocab();
    pushCloudReading();
    pushCloudPart("p5", p5Progress);
    pushCloudPart("p6", p6Progress);
    pushCloudPart("p1", p1Progress);
    pushCloudPart("p2", p2Progress);
    pushCloudPart("p3", p3Progress);
    pushCloudPart("p4", p4Progress);
    pushCloudSaved();
    pushCloudCardPos(cardPosPayload());
    pushCloudQuizPos(loadJSON("toeic-quiz-pos"));
    pushCloudDailyReading();
    pushCloudStory();
    render();
  }catch(err){
    cloudSyncing = false;
  }
});
function statusOf(id){ return progress[id] || null; }
function setStatus(id, status){
  if(progress[id] === status){ delete progress[id]; }
  else{ progress[id] = status; }
  saveProgress();
  renderStats();
}
/* Unconditional set (no toggle-off) — for automatic updates like quiz results, where re-affirming the same status must not clear the mark. */
function setStatusDirect(id, status){
  progress[id] = status;
  saveProgress();
  renderStats();
}

/* ---------- Speech ---------- */
const canSpeak = "speechSynthesis" in window;
/* Mobile TTS voices (iOS Siri voice, Android Google voice) tend to sound noticeably faster than
   desktop browser voices even at the same `rate` value, since rate is interpreted per voice engine —
   so mobile gets its own slower rate instead of one shared value. */
const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const SPEECH_RATE = isMobileDevice ? 0.78 : 0.92;
function speak(text, rate){
  if(!canSpeak) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = rate || SPEECH_RATE;
  window.speechSynthesis.speak(u);
}
/* Plays a list of strings in sequence (used for Part 2/3/4 audio). pitchFn(i) optionally varies pitch per line (e.g. by speaker). */
function speakSequence(texts, opts){
  opts = opts || {};
  if(!canSpeak){ opts.onDone && opts.onDone(); return; }
  window.speechSynthesis.cancel();
  let i = 0;
  function next(){
    if(i >= texts.length){ opts.onDone && opts.onDone(); return; }
    const u = new SpeechSynthesisUtterance(texts[i]);
    u.lang = "en-US";
    u.rate = SPEECH_RATE;
    if(opts.pitchFn) u.pitch = opts.pitchFn(i);
    u.onend = ()=>{ i++; next(); };
    u.onerror = ()=>{ i++; next(); };
    window.speechSynthesis.speak(u);
  }
  next();
}

/* ---------- Word lookup (click-to-define) ---------- */
function wrapWords(text){
  if(!text) return text;
  return text.replace(/[A-Za-z]+(?:['’][A-Za-z]+)?/g, (m)=> `<span class="lookup-word" data-w="${m.toLowerCase()}">${m}</span>`);
}

const wordLookupCache = {};
function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms || 6000);
  return fetch(url, {signal: controller.signal}).finally(()=>clearTimeout(timer));
}

/* Cheap English inflection guesses, so "employees"/"orders"/"planning" etc. resolve to a base form already in our dictionaries without needing a full lemmatizer. */
function wordVariants(w){
  const vs = new Set([w]);
  if(w.endsWith("ies")) vs.add(w.slice(0,-3)+"y");
  if(w.endsWith("es")){ vs.add(w.slice(0,-2)); vs.add(w.slice(0,-1)); }
  if(w.endsWith("s") && !w.endsWith("ss")) vs.add(w.slice(0,-1));
  if(w.endsWith("ing")){
    vs.add(w.slice(0,-3)); vs.add(w.slice(0,-3)+"e");
    if(w.length>4 && w[w.length-4]===w[w.length-5]) vs.add(w.slice(0,-4));
  }
  if(w.endsWith("ed")){
    vs.add(w.slice(0,-2)); vs.add(w.slice(0,-1));
    if(w.length>3 && w[w.length-3]===w[w.length-4]) vs.add(w.slice(0,-3));
  }
  if(w.endsWith("er")){ vs.add(w.slice(0,-2)); vs.add(w.slice(0,-1)); }
  if(w.endsWith("est")){ vs.add(w.slice(0,-3)); vs.add(w.slice(0,-2)); }
  if(w.endsWith("ly")) vs.add(w.slice(0,-2));
  return [...vs];
}

let supplementaryDict = null;
async function loadSupplementaryDict(){
  if(supplementaryDict) return supplementaryDict;
  try{
    await ensureCurrentVersion();
    const res = await fetch(dataPath("supplementary_dict.json"));
    supplementaryDict = res.ok ? await res.json() : [];
  }catch(err){ supplementaryDict = []; }
  return supplementaryDict;
}

async function lookupWord(word){
  const key = word.toLowerCase();
  if(wordLookupCache[key]) return wordLookupCache[key];
  const variants = wordVariants(key);

  let local = words.find(w=>w.word.toLowerCase() === key);
  if(!local){ for(const v of variants){ local = words.find(w=>w.word.toLowerCase() === v); if(local) break; } }
  if(local){
    const result = { word: local.word, ipa: local.ipa, pos: local.pos, meaning_zh: local.meaning_zh, note_zh: local.note_zh, example_en: local.example_en, example_zh: local.example_zh, importance: local.importance, audioUrl: null, source: "local" };
    wordLookupCache[key] = result;
    return result;
  }

  const supp = await loadSupplementaryDict();
  let match = supp.find(w=>w.word === key);
  if(!match){ for(const v of variants){ match = supp.find(w=>w.word === v); if(match) break; } }
  if(match){
    const result = { word: match.word, ipa: match.ipa, pos: match.pos, meaning_zh: match.meaning_zh, example_en: "", example_zh: "", audioUrl: null, source: "supplementary" };
    wordLookupCache[key] = result;
    return result;
  }

  let ipa = "", audioUrl = null, defEn = "", pos = "", meaningZh = "";

  const dictPromise = fetchWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`)
    .then(res => res.ok ? res.json() : null)
    .then(data => {
      const entry = data && data[0];
      if(!entry) return;
      ipa = entry.phonetic || (entry.phonetics||[]).map(p=>p.text).find(Boolean) || "";
      audioUrl = (entry.phonetics||[]).map(p=>p.audio).find(a=>a) || null;
      const meaning = (entry.meanings||[])[0];
      if(meaning){
        pos = meaning.partOfSpeech || "";
        defEn = (meaning.definitions||[])[0]?.definition || "";
      }
    }).catch(()=>{});

  const translatePromise = fetchWithTimeout(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(key)}&langpair=en|zh-TW`)
    .then(res => res.ok ? res.json() : null)
    .then(tdata => {
      let t = tdata?.responseData?.translatedText || "";
      if(/no query specified|invalid/i.test(t) || t.trim().toLowerCase() === key) t = "";
      meaningZh = t;
    }).catch(()=>{});

  await Promise.all([dictPromise, translatePromise]);
  const result = { word: key, ipa, pos, meaning_zh: meaningZh, example_en: defEn, example_zh: "", audioUrl, source: "api" };
  wordLookupCache[key] = result;
  return result;
}

function currentFilterList(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const cat = document.getElementById("categorySelect").value;
  const importance = document.getElementById("importanceSelect").value;
  const onlyUnknown = document.getElementById("onlyUnknown").checked;
  return words.filter(w=>{
    if(cat !== "all" && w.category !== cat) return false;
    if(importance !== "all" && w.importance !== importance) return false;
    if(onlyUnknown && statusOf(w.id) !== "unknown") return false;
    if(q && !(w.word.toLowerCase().includes(q) || w.meaning_zh.includes(q))) return false;
    return true;
  });
}

function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

/* Both card faces are absolutely positioned (inset:0) so the flip transform overlays them exactly, which means
   the card's own height doesn't grow with its content — a face taller than the card's fixed min-height just
   spills out past the card's edge. Fix: briefly lay each face out in normal flow to measure its real content
   height, then size the card to fit whichever face (front or back) needs the most room. */
function autosizeFlashcard(){
  const card = document.getElementById("flashcard");
  if(!card) return;
  const front = card.querySelector(".face.front");
  const back = card.querySelector(".face.back");
  if(!front || !back) return;
  card.style.minHeight = "0px";
  front.style.position = "static";
  const frontH = front.offsetHeight;
  front.style.position = "";
  back.style.position = "static";
  const backH = back.offsetHeight;
  back.style.position = "";
  card.style.minHeight = Math.max(frontH, backH, 320) + "px";
}

/* The ids the flashcard actually steps through: the active filter applied to the current (possibly
   shuffled) order. `cursor` is an index into THIS list, not into the full `order` — so any code that
   restores a saved position must resolve it against this list, or the card lands on the wrong word
   whenever a filter (e.g. the default 必考 filter) is active. */
function cardFinalIds(){
  const list = currentFilterList();
  const inList = new Set(list.map(w=>w.id));
  const filteredOrder = order.filter(id=>inList.has(id));
  return filteredOrder.length ? filteredOrder : list.map(w=>w.id);
}
/* Point `cursor` at the saved word. If that word isn't in the active filter (say it's a 常考 word but
   the filter is 必考), resume at the next visible word after it in the order, so you land roughly
   where you left off instead of jumping to a random card. */
function restoreCardCursor(id){
  const finalIds = cardFinalIds();
  if(finalIds.length === 0) return;
  let idx = finalIds.indexOf(id);
  if(idx < 0){
    const visible = new Set(finalIds);
    const from = order.indexOf(id);
    if(from >= 0){
      for(let i=from+1;i<order.length;i++){
        if(visible.has(order[i])){ idx = finalIds.indexOf(order[i]); break; }
      }
    }
  }
  cursor = idx >= 0 ? idx : 0;
}

/* ---------- Word page (flashcard mode) ----------
   One scrolling page per word, no flipping. Basic data comes from toeic_vocab.json; when
   data/<version>/word_details.json has an entry for the word ({ kk, chunks[], senses[], family[],
   collocations[], synonyms[], pattern{}, root?, tip, stressNote? }) the page also shows the syllable
   breakdown, per-sense examples, word family, collocations, paraphrases and pronunciation-rule words. */
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

    <div class="wpg-audio">

  const lead = `
    <p class="wpg-meaning zhh">${w.meaning_zh}</p>

  const wrap = (rest)=> `<div class="wpg-hero">${hero}</div><div class="wpg-body">${lead}${rest}</div>`;

        <button class="icon-btn" id="practiceClear" type="button">再寫一次</button>
      </div>
      <div class="pr-dict-actions">
        <button class="icon-btn" id="practiceCheck" type="button">檢查</button>
        <button class="icon-btn" id="practicePeek" type="button">看答案</button>
      </div>
      <div class="pr-fb mono" id="practiceFb" aria-live="polite"></div>
      <div class="pr-msg" id="practiceMsg"></div>
    </div>`);

  if(!d){
    const ex = w.example_en ? sec("例句", `<div class="wd-example">${spk(w.example_en)}<div><div class="en">${w.example_en}</div>${w.example_zh ? `<div class="zh">${w.example_zh}</div>` : ""}</div></div>`) : "";
    return wrap(practice + ex);
  }

  let color = 0;
  const tiles = d.chunks.map(c=>{
    const cls = c.silent ? "silent" : `c${color++ % 3}`;
    const inline = /[ˋˌ]/.test(c.k); // a stress mark already sits inside this chunk's KK (e.g. the x in expand)
    const mark = inline ? "" : c.s === 1 ? '<span class="wd-stress">ˋ</span>' : c.s === 2 ? "ˌ" : "";
    const kk = c.silent ? "不發音" : `${mark}${escHtml(c.k).replace("ˋ", '<span class="wd-stress">ˋ</span>')}`;

  color = 0;

    const cls = c.silent ? "silent" : `c${color++ % 3}`;

  const coll = d.collocations && d.collocations.length ? `<div>${sec("常見搭配", `<div class="wd-kv">

  const usage = (family || coll) ? `<div class="wpg-grid">${family}${coll}</div>` : "";

  const syn = d.synonyms && d.synonyms.length ? sec("同義改寫（Part 7 常用）",

  const pattern = d.pattern ? sec("同樣發音規則的字", `<p class="wd-p">${escHtml(d.pattern.rule)}</p>
    <div class="wd-chips">${d.pattern.words.map(x=>`<button class="wd-chip" ${say(x)} ${dis}>🔊 ${escHtml(x)}</button>`).join("")}</div>`) : "";
  const callouts = (d.root || d.tip) ? sec("記憶與提醒",

  return wrap(`${practice}${syllables}${senses}${usage}${syn}${pattern}${callouts}`);
}

/* ---------- Spelling practice on the flashcard page ----------
   Type the word you are looking at: each letter turns green or red as you go, a correct word is
   spoken aloud and counted, Enter (or 再寫一次) clears the box for another round. Case and accents
   are ignored (typing "resume" is accepted for "résumé"). */
/* While the phone keyboard is open the sticky ◀ ❌ ✅ ▶ bar rides up on top of it and gets cut off by the keyboard's
   toolbar. Detect the keyboard through the visual viewport and hide that bar until it closes. */
if(window.visualViewport){
  const vv = window.visualViewport;
  const syncKeyboard = ()=> document.body.classList.toggle("kb-open", window.innerHeight - vv.height > 120);
  vv.addEventListener("resize", syncKeyboard);
  vv.addEventListener("scroll", syncKeyboard);
}
let pracWordId = null, pracCount = 0, pracLatched = false;
let dictMode = false;
try{ dictMode = localStorage.getItem("toeic-dict-mode") === "1"; }catch(e){}
function pracNorm(x){ return String(x).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function setupSpellingPractice(w){
  const input = document.getElementById("practiceInput");
  if(!input) return;
  if(pracWordId !== w.id){ pracWordId = w.id; pracCount = 0; pracLatched = false; }
  const card = document.querySelector(".wpg-card");
  const fb = document.getElementById("practiceFb"), msg = document.getElementById("practiceMsg");
  const toggle = document.getElementById("dictToggle");
  const target = w.word;
  const show = (ch)=> ch === " " ? "\u00a0\u00a0" : escHtml(ch);
  const isDone = ()=> pracNorm(input.value.trim().replace(/\s+/g, " ")) === pracNorm(target);
  const diffHtml = (withPending)=>{
    const typed = input.value;
    let html = "";
    const n = withPending ? Math.max(typed.length, target.length) : typed.length;
    for(let i = 0; i < n; i++){
      if(i < typed.length){
        const ok = i < target.length && pracNorm(typed[i]) === pracNorm(target[i]);
        html += `<span class="${ok ? "ok" : "bad"}">${show(typed[i])}</span>`;
      }else{
        html += `<span class="pending">${target[i] === " " ? "\u00a0\u00a0" : "·"}</span>`;
      }
    }
    return html;
  };
  const applyMode = ()=>{
    toggle.checked = dictMode;
    card.classList.toggle("dict-on", dictMode);
    card.classList.remove("dict-revealed");
    input.placeholder = dictMode ? "聽發音，憑記憶拼出單字" : "看著單字，輸入一遍";
  };
  const finish = ()=>{                       // a correct word: count it, say it, uncover it
    input.classList.add("ok");
    if(!pracLatched){ pracLatched = true; pracCount++; speak(target); }
    card.classList.add("dict-revealed");
    msg.textContent = `✅ 拼對了！已拼對 ${pracCount} 次（按 Enter 或「再寫一次」繼續）`;
  };
  const update = ()=>{                       // live feedback while typing (normal mode only)
    if(dictMode){ input.classList.remove("ok"); fb.innerHTML = ""; if(!pracLatched) msg.textContent = pracCount ? `已拼對 ${pracCount} 次` : ""; return; }
    fb.innerHTML = diffHtml(true);
    if(isDone()){ finish(); }
    else{
      input.classList.remove("ok");
      if(input.value.length === 0) pracLatched = false;
      msg.textContent = pracCount ? `已拼對 ${pracCount} 次` : "";
    }
  };
  const check = ()=>{                        // dictation mode: judge only when asked
    if(input.value.trim() === ""){ msg.textContent = "先輸入你記得的拼法"; return; }
    fb.innerHTML = diffHtml(false);
    if(isDone()) finish();
    else msg.textContent = "❌ 還不對，修改後再按「檢查」，或點「看答案」";
  };
  const reset = ()=>{
    input.value = ""; input.classList.remove("ok"); pracLatched = false; fb.innerHTML = "";
    card.classList.remove("dict-revealed"); msg.textContent = pracCount ? `已拼對 ${pracCount} 次` : "";
    update(); input.focus();
  };
  toggle.addEventListener("change", ()=>{
    dictMode = toggle.checked;
    try{ localStorage.setItem("toeic-dict-mode", dictMode ? "1" : "0"); }catch(e){}
    pracLatched = false; input.value = ""; input.classList.remove("ok"); fb.innerHTML = ""; msg.textContent = pracCount ? `已拼對 ${pracCount} 次` : "";
    applyMode(); update();
  });
  input.addEventListener("input", update);
  input.addEventListener("keydown", (e)=>{
    if(e.key !== "Enter") return;
    e.preventDefault();
    if(pracLatched) reset();
    else if(dictMode) check();
  });
  document.getElementById("practiceClear").addEventListener("click", reset);
  document.getElementById("practiceCheck").addEventListener("click", check);
  document.getElementById("practicePeek").addEventListener("click", ()=>{
    card.classList.add("dict-revealed");
    fb.innerHTML = [...target].map(ch=>`<span class="pending" style="color:var(--text)">${show(ch)}</span>`).join("");
    msg.textContent = "答案在上方，看過再默寫一次";
  });
  applyMode();
  update();
}

/* ---------- Render: card mode ---------- */
function renderCardMode(container){
  const finalList = cardFinalIds();
  if(finalList.length === 0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的單字，試著調整搜尋或分類。</div>`;
    return;
  }
  if(cursor >= finalList.length) cursor = 0;
  const w = words.find(x=>x.id===finalList[cursor]);
  const st = statusOf(w.id);
  saveCardPosition(w.id);
  recordSeenToday(w.id);

  container.innerHTML = `
    <div class="wpg">
      <article class="wpg-card${showZh ? "" : " zh-off"}">${renderWordPage(w, st, finalList.length)}</article>
      <div class="wpg-bar">
        <div class="progress-bar"><div class="progress-fill" style="width:${((cursor+1)/finalList.length*100).toFixed(1)}%"></div></div>
        <div class="wpg-bar-row">
          <button class="nav-btn" id="prevBtn" title="上一個，不算已看過">◀</button>
          <button class="mark-btn unknown ${st==='unknown'?'active':''}" id="markUnknownBtn">❌ 還不熟</button>
          <span class="mono wpg-count">${cursor+1} / ${finalList.length}</span>
          <button class="mark-btn known ${st==='known'?'active':''}" id="markKnownBtn">✅ 已熟記</button>
          <button class="nav-btn" id="nextBtn" title="下一個，不算已看過">▶</button>
        </div>
      </div>
    </div>
  `;

  container.querySelectorAll(".wpg-card [data-say]").forEach(btn=>{
    btn.addEventListener("click", ()=> speak(btn.dataset.say, btn.dataset.rate ? Number(btn.dataset.rate) : undefined));
  });
  container.querySelectorAll(".card-save-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{ toggleSavedWord(w); renderStage(); });
  });
  setupSpellingPractice(w);
  const card = container.querySelector(".wpg-card");
  const eye = document.getElementById("eyeBtn");
  eye.addEventListener("click", ()=>{
    showZh = !showZh;
    card.classList.toggle("zh-off", !showZh);
    card.querySelectorAll(".zhh.shown").forEach(el=>el.classList.remove("shown"));
    eye.textContent = showZh ? "🙈" : "👁";
    eye.setAttribute("aria-pressed", String(showZh));
  });
  card.addEventListener("click", (e)=>{            // tap one blurred line to reveal just that line
    const el = e.target.closest(".zhh");
    if(el && card.classList.contains("zh-off")) el.classList.add("shown");
  });
  const go = (delta)=>{
    /* Resolve the target BY ID: marking a word can drop it from the list (e.g. 只看待複習), and stepping
       by index in the shrunken list would skip a card. */
    const targetId = finalList[(cursor+delta+finalList.length)%finalList.length];
    flipped = false; showZh = false;
    return targetId;
  };
  const showAfter = (targetId)=>{ const i = cardFinalIds().indexOf(targetId); cursor = i >= 0 ? i : 0; renderStage(); window.scrollTo(0, 0); };
  /* Direct set, not a toggle: pressing the same button again must not silently clear the mark. */
  document.getElementById("markUnknownBtn").addEventListener("click", ()=>{ const t = go(1); setStatusDirect(w.id, "unknown"); showAfter(t); });
  document.getElementById("markKnownBtn").addEventListener("click", ()=>{ const t = go(1); setStatusDirect(w.id, "known"); showAfter(t); });
  document.getElementById("prevBtn").addEventListener("click", ()=> showAfter(go(-1)));
  document.getElementById("nextBtn").addEventListener("click", ()=> showAfter(go(1)));
}

/* ---------- Render: list mode ---------- */
const LIST_PAGE_SIZE = 100;
let listPage = 1;

function renderListMode(container){
  const list = currentFilterList();
  if(list.length === 0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的單字，試著調整搜尋或分類。</div>`;
    return;
