/* ---------- Render: quiz mode ---------- */
/* Remembers which quiz question was last showing, so reopening the app resumes there
   instead of always rolling a brand-new random word. Timestamped like the flashcard position,
   for the same cross-device sync-on-login reason. */
function loadQuizPosition(){
  const raw = loadJSON("toeic-quiz-pos");
  return (raw && typeof raw.id === "number") ? raw.id : null;
}
function saveQuizPosition(id){
  /* Only stamp a fresh updatedAt when the position actually changed — this gets called on every
     render, including the very first one after a reload that's just restoring the same word that
     was already stored. Re-stamping "now" there would make this device always look most-recently-
     touched (even though nothing happened), permanently winning the cross-device merge regardless
     of what another device actually did more recently. */
  const existing = loadJSON("toeic-quiz-pos");
  if(existing && existing.id === id) return;
  const entry = { id, updatedAt: Date.now() };
  saveJSON("toeic-quiz-pos", entry);
  pushCloudQuizPos(entry);
}

/* Only quiz on words the user has actually reviewed before (marked known/unknown via flashcard
   or a previous quiz answer) — quizzing on words never seen felt meaningless. */
function seenFilterList(){
  return currentFilterList().filter(w => progress[w.id] !== undefined);
}

/* Cycle through every seen word (shuffled) before any word repeats, instead of picking with
   replacement each time — otherwise pure randomness can favor a few words and skip others for a while. */
let quizOrder = [];
let quizIdx = 0;
function rebuildQuizOrder(){
  quizOrder = seenFilterList().map(w=>w.id);
  for(let i=quizOrder.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [quizOrder[i],quizOrder[j]]=[quizOrder[j],quizOrder[i]]; }
  quizIdx = 0;
}

function pickQuizWord(forceId){
  /* A forced id only counts if it's actually a seen (progress-tracked) word — a saved quiz
     position from before this restriction existed could otherwise restore a never-reviewed word. */
  const forced = (forceId !== undefined && forceId !== null && progress[forceId] !== undefined)
    ? words.find(w=>w.id===forceId) : null;
  let candidate;
  if(forced){
    candidate = forced;
    if(!quizOrder.includes(forced.id)) rebuildQuizOrder();
    quizIdx = quizOrder.indexOf(forced.id) + 1;
  }else{
    const currentPoolIds = seenFilterList().map(w=>w.id);
    const sameSet = quizOrder.length === currentPoolIds.length && quizOrder.every(id=>currentPoolIds.includes(id));
    if(!sameSet || quizIdx >= quizOrder.length) rebuildQuizOrder();
    if(quizOrder.length === 0) return; // nothing seen yet under the current filter; renderQuizMode shows an empty state instead
    candidate = words.find(w=>w.id===quizOrder[quizIdx]);
    quizIdx++;
  }
  quizWord = candidate;
  const distractorsPool = words.filter(w=>w.id !== quizWord.id);
  const distractors = [];
  const shuffled = distractorsPool.slice().sort(()=>Math.random()-0.5);
  for(const w of shuffled){
    if(distractors.length >= 3) break;
    if(w.meaning_zh !== quizWord.meaning_zh) distractors.push(w);
  }
  const options = [quizWord, ...distractors].sort(()=>Math.random()-0.5);
  quizWord.options = options;
  quizLocked = false;
  saveQuizPosition(quizWord.id);
}

let quizScore = {correct:0, total:0};

function renderQuizMode(container){
  const seenPool = seenFilterList();
  if(seenPool.length === 0){
    container.innerHTML = `<div class="empty-state">你還沒有複習過符合篩選條件的單字，先到「字卡模式」看幾個單字（按 ✅ 已熟記或 ❌ 還不熟）之後，小測驗就會從你看過的單字出題。</div>`;
    return;
  }
  if(!quizWord || !seenPool.some(x=>x.id===quizWord.id)) pickQuizWord();
  const w = quizWord;
  container.innerHTML = `
    <div class="quiz-score mono">本次測驗　答對 ${quizScore.correct} / ${quizScore.total}</div>
    <div class="quiz-card">
      <div style="display:flex; gap:6px; align-items:center;">
        <span class="chip pos">${w.pos}</span>
        ${w.importance ? `<span class="chip imp">${importanceLabel(w.importance)}</span>` : ''}
      </div>
      <div class="word-block" style="padding-top:10px;">
        <p class="word">${w.word}</p>
        <p class="ipa mono">${w.ipa}</p>
        <div class="speak-row">
          <button class="speak-btn" id="quizSpeakBtn" ${canSpeak?'':'disabled'} title="播放發音">🔊</button>
        </div>
      </div>
      <p style="color:var(--text-muted);font-size:13px;margin:0;">這個字的中文意思是？</p>
      <div class="quiz-options">
        ${w.options.map((o,i)=>`<button class="opt-btn" data-idx="${i}">${o.meaning_zh}</button>`).join("")}
      </div>
      <div class="quiz-next" id="quizNextWrap" style="display:none;">
        <button class="icon-btn" id="quizNextBtn">下一題 ▶</button>
      </div>
    </div>
  `;
  document.getElementById("quizSpeakBtn")?.addEventListener("click", ()=> speak(w.word));
  container.querySelectorAll(".opt-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(quizLocked) return;
      quizLocked = true;
      const idx = Number(btn.dataset.idx);
      const chosen = w.options[idx];
      const isCorrect = chosen.id === w.id;
      quizScore.total++;
      if(isCorrect) quizScore.correct++;
      else saveWordFromQuizMistake(w);
      setStatusDirect(w.id, isCorrect ? "known" : "unknown");
      container.querySelectorAll(".opt-btn").forEach((b,i)=>{
        b.disabled = true;
        if(w.options[i].id === w.id) b.classList.add("correct");
        else if(i === idx) b.classList.add("wrong");
      });
      document.querySelector(".quiz-score").textContent = `本次測驗　答對 ${quizScore.correct} / ${quizScore.total}`;
      if(isCorrect){
        setTimeout(()=>{
          if(mode !== "quiz" || quizWord !== w) return; // user navigated away or a new question already loaded
          pickQuizWord();
          renderStage();
        }, 700);
      }else{
        document.getElementById("quizNextWrap").style.display = "block";
      }
    });
  });
  document.getElementById("quizNextBtn")?.addEventListener("click", ()=>{
    pickQuizWord();
    renderStage();
  });
}

function renderConversationOrTalk(container, kind){
  const isP3 = kind === "p3";
  const items = isP3 ? p3Items : p4Items;
  if(items.length === 0){ container.innerHTML = `<div class="empty-state">正在載入 Part ${isP3?3:4} 題目…</div>`; return; }
  if(isP3 && p3Order.length === 0) p3Order = p3Items.map(it=>it.id);
  if(!isP3 && p4Order.length === 0) p4Order = p4Items.map(it=>it.id);
  const order = isP3 ? p3Order : p4Order;
  const progressObj = isP3 ? p3Progress : p4Progress;
  const filterMode = document.getElementById("listeningFilterMode").value;
  const list = filterByMode(items, progressObj, filterMode);
  if(list.length === 0){ container.innerHTML = `<div class="empty-state">${filterMode==='wrong' ? '目前沒有答錯的題目！' : '這個分類已經全部完成了！'}切換上方篩選可以重新看其他題目。</div>`; return; }
  const filteredOrder = order.filter(id=>list.some(it=>it.id===id));
  const finalList = filteredOrder.length ? filteredOrder : list.map(it=>it.id);
  let idx = isP3 ? p3Idx : p4Idx;
  if(idx < 0) idx = finalList.length - 1;
  if(idx >= finalList.length) idx = 0;
  if(isP3) p3Idx = idx; else p4Idx = idx;
  const item = items.find(it=>it.id===finalList[idx]);
  const selected = isP3 ? p3Selected : p4Selected;
  const checked = isP3 ? p3Checked : p4Checked;
  const showText = isP3 ? p3ShowText : p4ShowText;
  const doneCount = items.filter(it=>progressObj[it.id]).length;
  const wrongCnt = wrongCount(items, progressObj);

  const lines = isP3 ? item.lines.map(l=>l.text) : [item.talk];
  const pitchFn = isP3 ? (i)=> (item.lines[i].speaker.includes("Woman") ? (item.lines[i].speaker.includes("2")?1.3:1.15) : (item.lines[i].speaker.includes("2")?0.85:1)) : undefined;

  const transcriptHtml = isP3
    ? item.lines.map(l=>`<div class="transcript-line"><b>${l.speaker}:</b> ${l.text}</div>`).join("")
    : `<div class="transcript-line">${item.talk}</div>`;

  const questionsHtml = item.questions.map((q,qi)=>{
    const chosen = selected[qi];
    const optsHtml = q.options.map((opt,oi)=>{
      let cls = "q-opt";
      if(checked){ if(oi===q.answer_index) cls += " correct"; else if(oi===chosen) cls += " wrong"; }
      return `<button class="${cls}" data-qi="${qi}" data-oi="${oi}" aria-pressed="${chosen===oi}" ${checked?'disabled':''}>${String.fromCharCode(65+oi)}. ${opt}</button>`;
    }).join("");
    const explainHtml = (checked && chosen !== undefined) ? `<div class="q-explain">${chosen===q.answer_index?'✅ 答對了！':'❌ 答錯了。'} 正確答案是 (${String.fromCharCode(65+q.answer_index)})。<br>${q.explanation_zh}</div>` : "";
    return `<div class="q-card"><div class="q-head">${qi+1}. ${q.question_en}</div>${optsHtml}${explainHtml}</div>`;
  }).join("");

  const answeredCount = Object.keys(selected).length;
  const catLabel = isP3 ? (P3_CATEGORY_LABELS[item.category]||item.category) : (P4_CATEGORY_LABELS[item.category]||item.category);

  container.innerHTML = `
    <div class="reading-head">
      <div class="reading-tag"><span class="chip cat">${catLabel}</span></div>
      <div class="reading-nav">
        <span>已完成 ${doneCount} / ${items.length}（答錯 ${wrongCnt}）</span>
        <button class="nav-btn" id="lPrevBtn" style="width:36px;height:36px;">◀</button>
        <span>${idx+1} / ${finalList.length}</span>
        <button class="nav-btn" id="lNextBtn" style="width:36px;height:36px;">▶</button>
      </div>
    </div>
    <div class="reading-layout">
      <div>
        <div class="listen-play-row"><button class="big-play-btn" id="lPlayBtn" ${canSpeak?'':'disabled'}>▶ 播放${isP3?'對話':'獨白'}</button></div>
        <div class="transcript-toggle"><button id="lToggleText">${showText ? '隱藏逐字稿' : '顯示逐字稿（非正式練習）'}</button></div>
        ${showText ? `<div class="transcript-box">${transcriptHtml}</div>` : ''}
      </div>
      <div class="questions-col">${questionsHtml}</div>
    </div>
    <div class="reading-actions">
      ${!checked ? `<button class="icon-btn" id="lCheckBtn" ${answeredCount<item.questions.length?'disabled':''}>提交答案（已作答 ${answeredCount}/${item.questions.length}）</button>` : `<button class="icon-btn" id="lRetryBtn">🔄 重新作答</button>`}
    </div>
  `;

  document.getElementById("lPlayBtn").addEventListener("click", ()=>{
    speakSequence(lines, {pitchFn});
  });
  document.getElementById("lToggleText").addEventListener("click", ()=>{
    if(isP3) p3ShowText = !p3ShowText; else p4ShowText = !p4ShowText;
    renderStage();
  });
  if(!checked){
    container.querySelectorAll(".q-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = Number(btn.dataset.qi), oi = Number(btn.dataset.oi);
        selected[qi] = oi;
        renderStage();
      });
    });
  }
  document.getElementById("lCheckBtn")?.addEventListener("click", ()=>{
    if(isP3) p3Checked = true; else p4Checked = true;
    progressObj[item.id] = item.questions.every((q,qi)=>selected[qi]===q.answer_index) ? "correct" : "wrong";
    saveVersionedProgress(isP3 ? "toeic-p3-progress" : "toeic-p4-progress", versionOf(isP3 ? "p3" : "p4"), progressObj);
    pushCloudPart(isP3 ? "p3" : "p4", progressObj);
    renderStage();
  });
  document.getElementById("lRetryBtn")?.addEventListener("click", ()=>{
    if(isP3){ p3Checked=false; p3Selected={}; p3ShowText=false; } else { p4Checked=false; p4Selected={}; p4ShowText=false; }
    renderStage();
  });
  document.getElementById("lPrevBtn").addEventListener("click", ()=>{
    speechSynthesis.cancel();
    if(isP3){ p3Idx--; p3Selected={}; p3Checked=false; p3ShowText=false; }
    else { p4Idx--; p4Selected={}; p4Checked=false; p4ShowText=false; }
    renderStage();
  });
  document.getElementById("lNextBtn").addEventListener("click", ()=>{
    speechSynthesis.cancel();
    if(isP3){ p3Idx++; p3Selected={}; p3Checked=false; p3ShowText=false; }
    else { p4Idx++; p4Selected={}; p4Checked=false; p4ShowText=false; }
    renderStage();
  });
}

/* ---------- Render: reading mode ---------- */
function docLabel(kind){
  return {email:"E-mail", memo:"Memo", letter:"Letter", ad:"Advertisement", advertisement:"Advertisement", notice:"Notice", article:"Article", webpage:"Web page", form:"Form"}[kind] || kind;
}
function renderDoc(doc){
  const metaHtml = (doc.meta && doc.meta.length) ? `<div class="doc-meta">${doc.meta.map(m=>`<div class="row2"><span class="label">${m.label}</span><span>${m.value}</span></div>`).join("")}</div>` : "";
  const parasHtml = (doc.paragraphs && doc.paragraphs.length) ? doc.paragraphs.map(p=>`<p class="doc-para">${wrapWords(p)}</p>`).join("") : "";
  const tableHtml = doc.table ? `<div class="doc-table-wrap"><table class="doc-table"><thead><tr>${doc.table.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${doc.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="doc-title">${doc.title || docLabel(doc.kind)}</div>${metaHtml}${parasHtml}${tableHtml}`;
}

function renderReadingMode(container){
  if(readingSets.length === 0){
    container.innerHTML = `<div class="empty-state">正在載入閱讀文章…</div>`;
    return;
  }
  const list = readingFilterList();
  const filteredOrder = readingOrder.filter(id=>list.some(s=>s.id===id));
  const finalList = filteredOrder.length ? filteredOrder : list.map(s=>s.id);
  if(finalList.length === 0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的文章，試著調整篩選條件。</div>`;
    return;
  }
  if(readingIdx >= finalList.length) readingIdx = 0;
  const set = readingSets.find(s=>s.id===finalList[readingIdx]);
  const activeDocIdx = readingDocTab[set.id] ?? 0;
  const answers = readingAnswers[set.id] || {};
  const checked = !!readingChecked[set.id];

  const docTabsHtml = set.passages.length > 1
    ? `<div class="doc-tabs">${set.passages.map((d,i)=>`<button class="doc-tab" data-doc="${i}" aria-selected="${i===activeDocIdx}">${d.title || docLabel(d.kind)}</button>`).join("")}</div>`
    : "";

  let correctCount = 0;
  const questionsHtml = set.questions.map((q,qi)=>{
    const chosen = answers[qi];
    const showResult = checked && chosen !== undefined;
    if(showResult && chosen === q.answer_index) correctCount++;
    const optsHtml = q.options.map((opt,oi)=>{
      let cls = "q-opt";
      if(checked){
        if(oi === q.answer_index) cls += " correct";
        else if(oi === chosen) cls += " wrong";
      }
      return `<button class="${cls}" data-qi="${qi}" data-oi="${oi}" aria-pressed="${chosen===oi}" ${checked?'disabled':''}>${String.fromCharCode(65+oi)}. ${opt}</button>`;
    }).join("");
    const explainHtml = (checked && chosen !== undefined) ? `<div class="q-explain">${chosen===q.answer_index ? '✅ 答對了！' : '❌ 答錯了。'} 正確答案是 (${String.fromCharCode(65+q.answer_index)})。<br>${q.question_zh ? `題目：${q.question_zh}<br>` : ""}${q.explanation_zh}</div>` : "";
    return `
      <div class="q-card">
        <div class="q-head">${qi+1}. ${q.question_en}</div>
        ${optsHtml}
        ${explainHtml}
      </div>
    `;
  }).join("");

  const answeredCount = Object.keys(answers).length;

  container.innerHTML = `
    <div class="reading-head">
      <div class="reading-tag">
        <span class="chip cat">${READING_TYPE_LABELS[set.type]}</span>
        <span class="chip pos">${READING_CATEGORY_LABELS[set.category] || set.category}</span>
        ${readingChecked[set.id]==='correct' ? `<span class="chip pos" style="background:var(--success-soft);color:var(--success);">✅ 答對</span>` : ''}
        ${readingChecked[set.id]==='wrong' ? `<span class="chip pos" style="background:var(--danger-soft);color:var(--danger);">❌ 答錯</span>` : ''}
      </div>
      <div class="reading-nav">
        <span>本篩選已完成 ${finalList.filter(id=>readingChecked[id]).length} / ${finalList.length}（答錯 ${finalList.filter(id=>readingChecked[id]==='wrong').length}）</span>
        <button class="nav-btn" id="readingPrevBtn" title="上一篇" style="width:36px;height:36px;">◀</button>
        <span>${readingIdx+1} / ${finalList.length}</span>
        <button class="nav-btn" id="readingNextBtn" title="下一篇" style="width:36px;height:36px;">▶</button>
      </div>
    </div>
    <div class="reading-layout">
      <div>
        ${docTabsHtml}
        <div class="doc-card">${renderDoc(set.passages[activeDocIdx])}</div>
      </div>
      <div class="questions-col">${questionsHtml}</div>
    </div>
    <div class="reading-actions">
      ${!checked ? `<button class="icon-btn" id="checkAnswersBtn" ${answeredCount===0?'disabled':''}>提交答案（已作答 ${answeredCount}/${set.questions.length}）</button>` : `<button class="icon-btn" id="retryBtn">🔄 重新作答</button>`}
    </div>
    ${checked ? `<div class="reading-score">本篇答對 ${correctCount} / ${set.questions.length} 題</div>` : ""}
  `;

  container.querySelectorAll(".doc-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{ readingDocTab[set.id] = Number(btn.dataset.doc); renderStage(); });
  });
  if(!checked){
    container.querySelectorAll(".q-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = Number(btn.dataset.qi), oi = Number(btn.dataset.oi);
        if(!readingAnswers[set.id]) readingAnswers[set.id] = {};
        readingAnswers[set.id][qi] = oi;
        saveReadingProgress();
        renderStage();
      });
    });
  }
  document.getElementById("checkAnswersBtn")?.addEventListener("click", ()=>{
    const curAnswers = readingAnswers[set.id] || {};
    readingChecked[set.id] = set.questions.every((q,qi)=>curAnswers[qi]===q.answer_index) ? "correct" : "wrong";
    saveReadingProgress();
    renderStage();
  });
  document.getElementById("retryBtn")?.addEventListener("click", ()=>{
    readingChecked[set.id] = false;
    readingAnswers[set.id] = {};
    saveReadingProgress();
    renderStage();
  });
  document.getElementById("readingPrevBtn").addEventListener("click", ()=>{
    readingIdx = (readingIdx-1+finalList.length)%finalList.length;
    renderStage();
  });
  document.getElementById("readingNextBtn").addEventListener("click", ()=>{
    readingIdx = (readingIdx+1)%finalList.length;
    renderStage();
  });
}

/* ---------- Daily reading: one auto-generated Part 7 style article per day ---------- */
function findDailySet(date){ return dailyReadingSets.find(s=>s.date===date); }
function sortedDailyDates(){ return dailyReadingSets.map(s=>s.date).sort().reverse(); } // newest first
/* The viewer's LOCAL calendar date (toISOString() is UTC, which is a day behind in Taiwan until 8 AM). */
function todayLocalStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function formatDailyDate(dateStr){
  const today = todayLocalStr();
  const d = new Date(dateStr+"T00:00:00");
  const label = `${d.getMonth()+1}月${d.getDate()}日`;
  return dateStr === today ? `${label}（今天）` : label;
}

function renderDailyReadingMode(container){
  if(dailyReadingSets.length === 0){
    container.innerHTML = `<div class="empty-state">還沒有每日文章。每天早上 6 點會自動產生一篇新的閱讀練習，明天回來看看吧！</div>`;
    return;
  }
  const dates = sortedDailyDates();

  if(dailyStage === "picker"){
    const rows = dates.map(date=>{
      const set = findDailySet(date);
      const title = set.passages[0].title || docLabel(set.passages[0].kind);
      const st = dailyChecked[date];
      return `
        <button class="hub-card" data-date="${date}">
          <div class="hub-card-title">${formatDailyDate(date)}　${title}</div>
          <div class="hub-card-sub" style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
            <span class="chip cat">${READING_TYPE_LABELS[set.type]}</span>
            <span class="chip pos">${READING_CATEGORY_LABELS[set.category] || set.category}</span>
            ${st==='correct' ? `<span class="chip pos" style="background:var(--success-soft);color:var(--success);">✅ 答對</span>` : ''}
            ${st==='wrong' ? `<span class="chip pos" style="background:var(--danger-soft);color:var(--danger);">❌ 答錯</span>` : ''}
          </div>
        </button>`;
    }).join("");
    container.innerHTML = `<div class="hub-intro">每天一篇全新的 TOEIC Part 7 閱讀文章，練習不間斷</div><div class="hub-list">${rows}</div>`;
    container.querySelectorAll(".hub-card[data-date]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        currentDailyDate = btn.dataset.date;
        dailyStage = "article";
        renderStage();
      });
    });
    return;
  }

  if(!currentDailyDate || !findDailySet(currentDailyDate)) currentDailyDate = dates[0];
  const set = findDailySet(currentDailyDate);
  const idx = dates.indexOf(currentDailyDate);
  const activeDocIdx = dailyDocTab[set.date] ?? 0;
  const answers = dailyAnswers[set.date] || {};
  const checked = !!dailyChecked[set.date];

  const docTabsHtml = set.passages.length > 1
    ? `<div class="doc-tabs">${set.passages.map((d,i)=>`<button class="doc-tab" data-doc="${i}" aria-selected="${i===activeDocIdx}">${d.title || docLabel(d.kind)}</button>`).join("")}</div>`
    : "";

  let correctCount = 0;
  const questionsHtml = set.questions.map((q,qi)=>{
    const chosen = answers[qi];
    const showResult = checked && chosen !== undefined;
    if(showResult && chosen === q.answer_index) correctCount++;
    const optsHtml = q.options.map((opt,oi)=>{
      let cls = "q-opt";
      if(checked){
        if(oi === q.answer_index) cls += " correct";
        else if(oi === chosen) cls += " wrong";
      }
      return `<button class="${cls}" data-qi="${qi}" data-oi="${oi}" aria-pressed="${chosen===oi}" ${checked?'disabled':''}>${String.fromCharCode(65+oi)}. ${opt}</button>`;
    }).join("");
    const explainHtml = (checked && chosen !== undefined) ? `<div class="q-explain">${chosen===q.answer_index ? '✅ 答對了！' : '❌ 答錯了。'} 正確答案是 (${String.fromCharCode(65+q.answer_index)})。<br>${q.question_zh ? `題目：${q.question_zh}<br>` : ""}${q.explanation_zh}</div>` : "";
    return `
      <div class="q-card">
        <div class="q-head">${qi+1}. ${q.question_en}</div>
        ${optsHtml}
        ${explainHtml}
      </div>
    `;
  }).join("");

  const answeredCount = Object.keys(answers).length;

  container.innerHTML = `
    <button class="icon-btn" id="dailyBackBtn" style="margin-bottom:14px;">◀ 返回列表</button>
    <div class="reading-head">
      <div class="reading-tag">
        <span class="chip cat">${formatDailyDate(set.date)}</span>
        <span class="chip pos">${READING_TYPE_LABELS[set.type]}</span>
        <span class="chip pos">${READING_CATEGORY_LABELS[set.category] || set.category}</span>
        ${dailyChecked[set.date]==='correct' ? `<span class="chip pos" style="background:var(--success-soft);color:var(--success);">✅ 答對</span>` : ''}
        ${dailyChecked[set.date]==='wrong' ? `<span class="chip pos" style="background:var(--danger-soft);color:var(--danger);">❌ 答錯</span>` : ''}
      </div>
      <div class="reading-nav">
        <button class="nav-btn" id="dailyPrevBtn" title="前一天" style="width:36px;height:36px;" ${idx>=dates.length-1?'disabled':''}>◀</button>
        <span>${idx+1} / ${dates.length}</span>
        <button class="nav-btn" id="dailyNextBtn" title="後一天" style="width:36px;height:36px;" ${idx<=0?'disabled':''}>▶</button>
      </div>
    </div>
    <div class="reading-layout">
      <div>
        ${docTabsHtml}
        <div class="doc-card">${renderDoc(set.passages[activeDocIdx])}</div>
      </div>
      <div class="questions-col">${questionsHtml}</div>
    </div>
    <div class="reading-actions">
      ${!checked ? `<button class="icon-btn" id="dailyCheckBtn" ${answeredCount===0?'disabled':''}>提交答案（已作答 ${answeredCount}/${set.questions.length}）</button>` : `<button class="icon-btn" id="dailyRetryBtn">🔄 重新作答</button>`}
    </div>
    ${checked ? `<div class="reading-score">本篇答對 ${correctCount} / ${set.questions.length} 題</div>` : ""}
  `;

  document.getElementById("dailyBackBtn").addEventListener("click", ()=>{ dailyStage = "picker"; renderStage(); });
  container.querySelectorAll(".doc-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{ dailyDocTab[set.date] = Number(btn.dataset.doc); renderStage(); });
  });
  if(!checked){
    container.querySelectorAll(".q-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = Number(btn.dataset.qi), oi = Number(btn.dataset.oi);
        if(!dailyAnswers[set.date]) dailyAnswers[set.date] = {};
        dailyAnswers[set.date][qi] = oi;
        saveDailyProgress();
        renderStage();
      });
    });
  }
  document.getElementById("dailyCheckBtn")?.addEventListener("click", ()=>{
    const curAnswers = dailyAnswers[set.date] || {};
    dailyChecked[set.date] = set.questions.every((q,qi)=>curAnswers[qi]===q.answer_index) ? "correct" : "wrong";
    saveDailyProgress();
    renderStage();
  });
  document.getElementById("dailyRetryBtn")?.addEventListener("click", ()=>{
    dailyChecked[set.date] = false;
    dailyAnswers[set.date] = {};
    saveDailyProgress();
    renderStage();
  });
  document.getElementById("dailyPrevBtn")?.addEventListener("click", ()=>{
    if(idx < dates.length-1){ currentDailyDate = dates[idx+1]; renderStage(); }
  });
  document.getElementById("dailyNextBtn")?.addEventListener("click", ()=>{
    if(idx > 0){ currentDailyDate = dates[idx-1]; renderStage(); }
  });
}

/* ---------- Master render ---------- */
function renderStage(){
  const container = document.getElementById("stage");
  if(vocabLoadFailed && (mode === "card" || mode === "list" || mode === "quiz")){
    container.innerHTML = `
      <div class="empty-state">單字資料載入失敗（可能是網路不穩）。<br>你的學習進度都還在，沒有受到影響。<br><br>
        <button class="icon-btn" id="vocabRetryBtn" style="margin:0 auto;">🔄 重新載入單字</button>
      </div>`;
    document.getElementById("vocabRetryBtn").addEventListener("click", ()=> loadVocab());
    return;
  }
  if(mode === "card") renderCardMode(container);
  else if(mode === "list") renderListMode(container);
  else if(mode === "reading") renderReadingMode(container);
  else if(mode === "grammar") renderGrammarMode(container);
  else if(mode === "listening") renderListeningMode(container);
  else if(mode === "toeic_hub") renderToeicHub(container);
  else if(mode === "theme") renderThemeMode(container);
  else if(mode === "phrase") renderPhraseMode(container);
  else if(mode === "lesson") renderLessonMode(container);
  else if(mode === "saved") renderSavedMode(container);
  else if(mode === "spelling") renderSpellingMode(container);
  else if(mode === "daily") renderDailyReadingMode(container);
  else if(mode === "story") renderStoryMode(container);
  else renderQuizMode(container);
}

/* ---------- Saved words (collected from the lookup popup) ---------- */
function renderSavedMode(container){
  const list = Object.values(savedWords).sort((a,b)=>
    Math.max(b.savedAt||0, b.lastWrongAt||0) - Math.max(a.savedAt||0, a.lastWrongAt||0));
  if(list.length === 0){
    container.innerHTML = `<div class="empty-state">還沒有收藏任何單字。閱讀或文法測驗時點擊不懂的單字查詢意思，或在小測驗答錯，再按 🤍 即可加入收藏，方便之後複習。</div>`;
    return;
  }
  const rows = list.map(w=>`
    <div class="hub-card" style="cursor:default;">
      <div class="saved-word-head">
        <span class="word-card-word">${w.word}</span>
        ${w.ipa ? `<span class="mono">${w.ipa}</span>` : ''}
        <button class="speak-btn" data-speak="${w.word}">🔊</button>
        <button class="speak-btn unsave-btn" data-unsave="${w.word}" title="移除收藏">❤️</button>
      </div>
      <div style="display:flex; gap:6px;">
        ${w.pos ? `<div class="wp-pos">${w.pos}</div>` : ''}
        ${w.importance ? `<div class="wp-pos" style="background:var(--surface-2);color:var(--text-muted);">${importanceLabel(w.importance)}</div>` : ''}
      </div>
      <div class="wp-meaning">${w.meaning_zh || '（無中文翻譯）'}</div>
      ${w.note_zh ? `<div class="note-zh">💡 ${w.note_zh}</div>` : ''}
      ${w.example_en ? `<div class="wp-example"><div>${w.example_en}</div>${w.example_zh ? `<div class="zh">${w.example_zh}</div>` : ''}</div>` : ''}
      ${w.wrongCount ? `<div class="hub-card-sub" style="margin-top:8px;">⚠️ 小測驗答錯 ${w.wrongCount} 次${w.lastWrongAt ? `，最近一次 ${new Date(w.lastWrongAt).toLocaleDateString('zh-TW')}` : ''}</div>` : ''}
    </div>
  `).join("");
  container.innerHTML = `<div class="hub-intro">已收藏 ${list.length} 個單字</div><div class="hub-list">${rows}</div>`;
  container.querySelectorAll("[data-speak]").forEach(btn=>{
    btn.addEventListener("click", ()=> speak(btn.dataset.speak));
  });
  container.querySelectorAll("[data-unsave]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      delete savedWords[btn.dataset.unsave.toLowerCase()];
      saveJSON("toeic-saved-words", savedWords);
      pushCloudSaved();
      renderStage();
    });
  });
}

/* ---------- Spelling quiz: dictation from saved (❤️) words ---------- */
function renderSpellingMode(container){
  const keys = Object.keys(savedWords);
  if(keys.length === 0){
    container.innerHTML = `<div class="empty-state">還沒有收藏任何單字，沒辦法出拼字題。先在字卡、主題單字或小測驗按 🤍 收藏幾個單字，再回來挑戰拼字吧！</div>`;
    return;
  }
  if(spellingOrder.length === 0) rebuildSpellingOrder();

  if(spellingIdx >= spellingOrder.length){
    container.innerHTML = `
      <div class="quiz-card">
        <p style="font-size:18px;font-weight:700;margin:0 0 10px;">🎉 這輪拼字測驗完成了！</p>
        <p style="color:var(--text-muted);">正確 ${spellingStats.correct} 題，錯誤 ${spellingStats.wrong} 題（共 ${spellingOrder.length} 題）</p>
        <div class="mark-row" style="margin-top:18px;">
          <button class="mark-btn known" id="spellingRestartBtn">🔄 再測一輪</button>
        </div>
      </div>`;
    document.getElementById("spellingRestartBtn").addEventListener("click", ()=>{
      rebuildSpellingOrder();
      renderStage();
    });
    return;
  }

  const key = spellingOrder[spellingIdx];
  const w = savedWords[key];
  if(!w){ // was un-saved mid-round
    spellingIdx++; spellingChecked = false; spellingCorrect = null;
    spellingHintCount = 0; spellingMissed = false; spellingLastAttempt = null;
    renderStage(); return;
  }

  container.innerHTML = `
    <div class="quiz-score mono">第 ${spellingIdx+1} / ${spellingOrder.length} 題　✅ ${spellingStats.correct}　❌ ${spellingStats.wrong}</div>
    <div class="quiz-card">
      <div style="display:flex; gap:6px; align-items:center; justify-content:center;">
        ${w.pos ? `<span class="chip pos">${w.pos}</span>` : ''}
        ${w.importance ? `<span class="chip imp">${importanceLabel(w.importance)}</span>` : ''}
      </div>
      <p class="meaning" style="margin-top:16px;">${w.meaning_zh || '（無中文翻譯）'}</p>
      ${w.note_zh ? `<div class="note-zh">💡 ${w.note_zh}</div>` : ''}
      <div class="speak-row" style="margin:18px 0;">
        <button class="speak-btn" id="spellingPlayBtn" title="播放發音" ${canSpeak?'':'disabled'}>🔊</button>
      </div>
      ${!spellingChecked ? `
      <div class="spelling-hint mono">${spellingHintDisplay(w.word, spellingHintCount)}</div>
      <div style="margin:10px 0 18px;">
        <button class="icon-btn" id="spellingHintBtn" ${spellingHintCount >= spellingMaxHint(w.word) ? 'disabled' : ''}>💡 提示（看下一個字母）</button>
      </div>` : ''}
      <input type="text" id="spellingInput" class="spelling-input" placeholder="請輸入英文拼法" autocomplete="off" autocapitalize="off" spellcheck="false" ${spellingChecked?'disabled':''}>
      <div id="spellingDiffRow" class="spelling-diff">${(!spellingChecked && spellingLastAttempt) ? spellingDiffHtml(spellingLastAttempt, w.word) : ''}</div>
      <div class="mark-row">
        ${spellingChecked
          ? `<button class="mark-btn known" id="spellingNextBtn">下一題 ▶</button>`
          : `<button class="mark-btn known" id="spellingCheckBtn">送出答案</button>`}
      </div>
      ${!spellingChecked && spellingLastAttempt ? `<p class="spelling-feedback wrong">❌ 還不對，紅色的字母是拼錯的地方，改一下再送出一次！</p>` : ''}
      ${spellingChecked ? `
        <div class="spelling-feedback correct">
          ✅ 正確！ <span class="mono">${w.word}</span>
          ${w.ipa ? `<span class="ipa mono" style="margin-left:8px;">${w.ipa}</span>` : ''}
        </div>
        ${w.example_en ? `
        <div class="example" style="margin-top:14px;">
          <button class="speak-btn" id="spellingSpeakExampleBtn" style="width:32px;height:32px;font-size:14px;flex:none;" title="播放例句" ${canSpeak?'':'disabled'}>🔊</button>
          <div>
            <div class="txt">${w.example_en}</div>
            ${w.example_zh ? `<div class="txt-zh">${w.example_zh}</div>` : ''}
          </div>
        </div>` : ''}
      ` : ''}
    </div>
  `;

  const input = document.getElementById("spellingInput");
  if(!spellingChecked) input.focus();

  const playBtn = document.getElementById("spellingPlayBtn");
  if(playBtn) playBtn.addEventListener("click", ()=> speak(w.word));
  const exampleSpeakBtn = document.getElementById("spellingSpeakExampleBtn");
  if(exampleSpeakBtn) exampleSpeakBtn.addEventListener("click", ()=> speak(w.example_en));
  const hintBtn = document.getElementById("spellingHintBtn");
  if(hintBtn) hintBtn.addEventListener("click", ()=>{
    /* Update the hint text and button state directly instead of a full renderStage() —
       a full re-render would recreate the input element and wipe whatever the user had
       already typed. */
    if(spellingHintCount < spellingMaxHint(w.word)) spellingHintCount++;
    const hintEl = container.querySelector(".spelling-hint");
    if(hintEl) hintEl.textContent = spellingHintDisplay(w.word, spellingHintCount);
    if(spellingHintCount >= spellingMaxHint(w.word)) hintBtn.disabled = true;
  });

  function advanceToNextQuestion(){
    spellingIdx++;
    spellingChecked = false;
    spellingCorrect = null;
    spellingHintCount = 0;
    spellingMissed = false;
    spellingLastAttempt = null;
    renderStage();
  }

  function checkAnswer(){
    if(spellingChecked) return;
    const answer = input.value.trim();
    const isCorrect = answer.length > 0 && answer.toLowerCase() === w.word.trim().toLowerCase();
    if(isCorrect){
      spellingCorrect = true;
      spellingChecked = true;
      spellingLastAttempt = null;
      spellingStats.correct++;
      renderStage();
    }else{
      /* Wrong: only counts once per question no matter how many times they retry, but they
         keep the same question — see the letter-by-letter diff and fix it themselves rather
         than being handed the answer outright. */
      if(!spellingMissed){
        spellingMissed = true;
        spellingStats.wrong++;
        w.wrongCount = (w.wrongCount || 0) + 1;
        w.lastWrongAt = Date.now();
        saveJSON("toeic-saved-words", savedWords);
        pushCloudSaved();
      }
      spellingLastAttempt = answer;
      renderStage();
    }
  }
  document.getElementById("spellingCheckBtn")?.addEventListener("click", checkAnswer);
  document.getElementById("spellingNextBtn")?.addEventListener("click", advanceToNextQuestion);
  if(input){
    input.addEventListener("keydown", (e)=>{
      if(e.key !== "Enter") return;
      e.preventDefault();
      checkAnswer();
    });
  }
}

/* Highlighting so learners can see WHICH word a sentence is teaching:
   - lessonProse(): Chinese explanations mention English terms (a / an / the, -tion, by the time…);
     give each run of English its own colour.
   - lessonMarked(): example sentences carry **word** markers around the exact word being illustrated.
   - lessonTrapHtml(): traps look like "陷阱：…❌ wrong → ✅ right（原因）"; markers inside the ❌ part render
     red (the mistake) and inside the ✅ part green (the fix). */
function lessonProse(text){
  return text.replace(/-?[A-Za-z][A-Za-z.'’\-]*(?:\s+-?[A-Za-z][A-Za-z.'’\-]*)*/g, m=>`<span class="en-term">${m}</span>`);
}
function lessonMarked(text){
  return text.split("**").map((seg,i)=> i%2 ? `<mark class="hl">${wrapWords(seg)}</mark>` : wrapWords(seg)).join("");
}
function lessonTrapHtml(text){
  const i = text.indexOf("❌");
  const head = i > 0 ? lessonProse(text.slice(0,i)) : "";
  let body = i >= 0 ? text.slice(i) : text;
  body = body.replace(/（[^）]*）/g, m=>lessonProse(m));
  body = body.replace(/\*\*(.+?)\*\*/g, (m, seg, off, whole)=>{
    const before = whole.slice(0, off);
    const cls = before.lastIndexOf("✅") > before.lastIndexOf("❌") ? "hl good" : "hl bad";
    return `<mark class="${cls}">${seg}</mark>`;
  });
  return head + body;
}

      const l = byCat[c];

      <p class="lesson-p">${lessonProse(kp.explain_zh)}</p>

  const trapsHtml = l.traps_zh.map(t=>`<div class="lesson-trap">${lessonTrapHtml(t)}</div>`).join("");

  const checkHtml = l.quick_check.map((q,qi)=>{
    const key = l.category + ":" + qi;
    const chosen = lessonAnswers[key];
    const answered = chosen !== undefined;
    const blank = answered ? `<span class="p5-blank">${q.options[chosen]}</span>` : `<span class="p5-blank">＿＿＿＿</span>`;
    const sentence = wrapWords(q.sentence).replace(/_{4,}/, blank);
    const opts = q.options.map((opt,oi)=>{
      let cls = "q-opt";
      if(answered){
        if(oi === q.answer_index) cls += " correct";
        else if(oi === chosen) cls += " wrong";
      }
      return `<button class="${cls}" data-qc="${qi}" data-oi="${oi}" ${answered?'disabled':''}>${String.fromCharCode(65+oi)}. ${opt}</button>`;
    }).join("");
    const explain = answered ? `<div class="q-explain">${chosen===q.answer_index?'✅ 答對了！':'❌ 答錯了。'} 正確答案是 (${String.fromCharCode(65+q.answer_index)})。<br>${lessonProse(q.explanation_zh)}</div>` : "";
    return `<div class="q-card"><div class="q-head" style="margin-bottom:8px;">${qi+1}. ${sentence}</div>${opts}${explain}</div>`;
  }).join("");

  const qs = p5Items.filter(it=>it.category === l.category);

  const versions = allVersions;
  const summaries = await Promise.all(versions.map(v=>generationProgressSummary(v)));
  const listEl = document.getElementById("hubGenList");
  if(!listEl) return; // user navigated away while this was loading
  const rows = versions.map((v,i)=>{
    const {done, total} = summaries[i];
    const pct = total ? Math.round(done/total*100) : 0;
    const activeTag = v === currentVersion ? `<span class="chip pos" style="margin-left:8px;">目前使用中</span>` : "";
    return `
      <button class="hub-card" data-version="${v}">
        <div class="hub-card-title">${v}${activeTag}</div>
        <div class="hub-card-sub">已完成 ${done} / ${total}</div>
        <div class="hub-card-bar"><div class="hub-card-bar-fill" style="width:${pct}%;"></div></div>
      </button>`;
  }).join("");
  listEl.innerHTML = rows;
  listEl.querySelectorAll(".hub-card[data-version]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const v = btn.dataset.version;
      if(v !== currentVersion){
        btn.disabled = true;
        const sub = btn.querySelector(".hub-card-sub");
        if(sub) sub.textContent = "載入中…";
        await switchToVersion(v);
      }
      toeicHubStage = "parts";
      renderStage();
    });
  });
}
function render(){
  updateFilterSummary();
  renderStats();
  renderStage();
}

/* ---------- Load data ---------- */
/* Remembers which word the flashcard was last showing, so reopening the app resumes there
   instead of always starting back at word 1. Stored with a timestamp (not just the bare id) so
   this can sync across devices via cloud-auth-changed: whichever device moved most recently wins. */
function loadCardPosition(){
  const raw = loadJSON("toeic-card-pos");
  return (raw && typeof raw.id === "number") ? raw : null;
}
/* One remembered spot per filter combination (分類 × 重要度 × 只看待複習), so switching between, say, 必考 and
   常考 or between categories brings you back to where YOU were in that list instead of word 1 — or in the
   one global spot, which only made sense for whichever list was open when it was saved. Searching is a
   throw-away view and is never remembered. */
function cardFilterKey(){
  return [document.getElementById("categorySelect").value, document.getElementById("importanceSelect").value,
          document.getElementById("onlyUnknown").checked ? "unknown" : "all"].join("|");
}
function loadCardPosMap(){
  const raw = loadJSON("toeic-card-pos-map");
  return (raw && typeof raw === "object" && !Array.isArray(raw)) ? raw : {};
}
function cardPosPayload(){ // what goes to the cloud: the legacy "last position" fields plus the per-filter map
  return { ...(loadCardPosition() || {}), map: loadCardPosMap() };
}
function saveCardPosition(id){
  if(document.getElementById("searchInput").value.trim()) return;
  /* Same reasoning as saveQuizPosition: don't re-stamp updatedAt when the position hasn't actually
     changed, or a mere page reload always wins the cross-device merge no matter what. */
  const map = loadCardPosMap(), key = cardFilterKey();
  if(map[key] && map[key].id === id) return;
  const entry = { id, updatedAt: Date.now() };
  map[key] = entry;
  saveJSON("toeic-card-pos-map", map);
  saveJSON("toeic-card-pos", entry);
  pushCloudCardPos(cardPosPayload());
}
/* Jump to the remembered spot for the filter combination that is active right now (word 1 if none yet). */
function restoreCardForCurrentFilter(){
  if(document.getElementById("searchInput").value.trim()){ cursor = 0; return; }
  const entry = loadCardPosMap()[cardFilterKey()];
  if(entry) restoreCardCursor(entry.id); else cursor = 0;
}

/* True when the real word bank couldn't be downloaded (flaky network). The vocab tabs then show a retry
   button instead of the 3 built-in sample words — showing samples on the live site made 總字數 read 3 and,
   worse, let the card/quiz overwrite your saved position (and cloud copy) with a sample word's id. */
let vocabLoadFailed = false;
async function loadVocab(){
  const stage = document.getElementById("stage");
  stage.innerHTML = `<div class="empty-state">正在載入單字資料…</div>`;
  vocabLoadFailed = false;
  let data = null;
  for(let attempt=0; attempt<3 && !data; attempt++){
    try{
      await ensureCurrentVersion();
      const res = await fetch(dataPath("toeic_vocab.json"));
      if(!res.ok) throw new Error("HTTP " + res.status);
      const parsed = await res.json();
      if(!Array.isArray(parsed) || parsed.length === 0) throw new Error("empty vocab file");
      data = parsed;
    }catch(err){
      if(attempt < 2) await new Promise(r=>setTimeout(r, 1000*(attempt+1)));
    }
  }
  if(data){
    words = data.map((w,i)=>({...w, id: w.id ?? i}));
  }else if(location.protocol === "file:"){
    // Opened by double-clicking the file: the browser blocks reading local data, so show a tiny sample set.
    words = FALLBACK_VOCAB.map((w,i)=>({...w, id:i}));
    stage.innerHTML = `<div class="empty-state">找不到單字資料，暫時顯示少量範例單字。<br>（若是直接雙擊開啟 index.html，瀏覽器會擋掉本機檔案讀取，請改用網站連結或本機伺服器開啟。）</div>`;
  }else{
    words = [];
    vocabLoadFailed = true;
  }
  order = words.map(w=>w.id);
  // Categories must be populated first: with an empty category <select>, its value is "" and the
  // filter would match nothing, so the saved position couldn't be resolved against the filtered list.
  populateCategories();
  const posMap = loadCardPosMap();
  if(Object.keys(posMap).length === 0){        // first run after this feature: the old single spot belongs to the open list
    const legacy = loadCardPosition();
    if(legacy) saveJSON("toeic-card-pos-map", { [cardFilterKey()]: legacy });
  }
  restoreCardForCurrentFilter();
  const savedQuizId = loadQuizPosition();
  if(savedQuizId !== null && words.some(w=>w.id===savedQuizId)){
    pickQuizWord(savedQuizId);
  }
  render();
}

async function loadJSONData(relPath, fallback){
  try{
    await ensureCurrentVersion();
    const res = await fetch(dataPath(relPath));
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    return data.map((it,i)=>({...it, id: it.id ?? i}));
  }catch(err){
    return fallback.map((it,i)=>({...it, id:i}));
  }
}

/* Appearance: "auto" follows the computer's light/dark setting (the default, and why the site turns
   dark on a dark-mode computer); "light"/"dark" force one. Saved per browser. */
const THEME_LABELS_UI = { auto:"🌓 自動", light:"☀️ 淺色", dark:"🌙 深色" };
function currentThemeChoice(){
  let t = "auto";
  try{ const s = localStorage.getItem("toeic-theme"); if(s === "light" || s === "dark") t = s; }catch(e){}
  return t;
}
function applyThemeChoice(t){
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  try{ if(t === "auto") localStorage.removeItem("toeic-theme"); else localStorage.setItem("toeic-theme", t); }catch(e){}
  const btn = document.getElementById("themeToggle");
  if(btn) btn.textContent = THEME_LABELS_UI[t];
}
document.getElementById("themeToggle").addEventListener("click", ()=>{
  const next = { auto:"light", light:"dark", dark:"auto" }[currentThemeChoice()];
  applyThemeChoice(next);
});
applyThemeChoice(currentThemeChoice());

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
    getFirestore, doc, getDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD98VuESGm9Q_qy-LMH0lEInO9vQ3i5g0g",
    authDomain: "toeic-vocab-c0461.firebaseapp.com",
    projectId: "toeic-vocab-c0461",
    storageBucket: "toeic-vocab-c0461.firebasestorage.app",
    messagingSenderId: "23914630655",
    appId: "1:23914630655:web:5b00a2717cda6e1494ebca"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  window.cloudAuth = {
    /* Popup is actually the more reliable path on most desktop browsers — redirect can silently fail
       to complete on Chrome/Firefox when third-party storage is restricted (a common privacy default),
       coming back from Google still signed out with no error at all. But popups get blocked on many
       mobile browsers. So: try popup first, and only fall back to redirect if the popup itself couldn't
       open — not if the user just closed it. */
    signIn: async () => {
      try{
        await signInWithPopup(auth, provider);
      }catch(err){
        if(err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment"){
          try{ await signInWithRedirect(auth, provider); }
          catch(err2){ alert("登入失敗：" + err2.code + " " + err2.message); }
        }else if(err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request"){
          alert("登入失敗：" + err.code + " " + err.message);
        }
      }
    },
    signOut: () => signOut(auth)
  };
  getRedirectResult(auth).catch(err => alert("登入失敗：" + err.code + " " + err.message));

  const PROGRESS_KEYS = ["vocab","reading","p5","p6","p1","p2","p3","p4","savedWords","cardPos","quizPos","dailyReading","story"];

  window.cloudSync = {
    async loadProgress(uid){
      const snaps = await Promise.all(PROGRESS_KEYS.map(key => getDoc(doc(db, "users", uid, "progress", key))));
      const out = {};
      PROGRESS_KEYS.forEach((key, i) => { out[key] = snaps[i].exists() ? snaps[i].data().data : null; });
      return out;
    },
    save(uid, key, data){
      return setDoc(doc(db, "users", uid, "progress", key), { data, updatedAt: Date.now() });
    },
    saveVocab(uid, data){ return this.save(uid, "vocab", data); },
    saveReading(uid, data){ return this.save(uid, "reading", data); }
  };

  onAuthStateChanged(auth, (user)=>{
    window.dispatchEvent(new CustomEvent("cloud-auth-changed", { detail: { user } }));
  });
</script>
