<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多益單字通</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f6f3ec;
    --surface:#ffffff;
    --surface-2:#efeae0;
    --border:#ddd5c7;
    --text:#262420;
    --text-muted:#6e6658;
    --accent:#1e4b43;
    --accent-contrast:#ffffff;
    --accent-soft:#dceae6;
    --gold:#a9834f;
    --gold-soft:#f1e6d3;
    --danger:#b3492f;
    --danger-soft:#f4e2dc;
    --success:#3e7b58;
    --success-soft:#dfeee4;
    --shadow: 0 1px 2px rgba(38,36,32,.06), 0 8px 24px -12px rgba(38,36,32,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181a;
      --surface:#1d2124;
      --surface-2:#23282b;
      --border:#33393d;
      --text:#edeae3;
      --text-muted:#a7a296;
      --accent:#4fa98f;
      --accent-contrast:#08201b;
      --accent-soft:#1f3a34;
      --gold:#d8b378;
      --gold-soft:#3a3021;
      --danger:#e2836a;
      --danger-soft:#3a2620;
      --success:#4fa98f;
      --success-soft:#1f3a34;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181a;
    --surface:#1d2124;
    --surface-2:#23282b;
    --border:#33393d;
    --text:#edeae3;
    --text-muted:#a7a296;
    --accent:#4fa98f;
    --accent-contrast:#08201b;
    --accent-soft:#1f3a34;
    --gold:#d8b378;
    --gold-soft:#3a3021;
    --danger:#e2836a;
    --danger-soft:#3a2620;
    --success:#4fa98f;
    --success-soft:#1f3a34;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ text-wrap:balance; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace; }
  button{ font-family:inherit; }

  .app{ max-width:920px; margin:0 auto; padding:28px 20px 64px; }

  .top{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .kicker{ font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  .brand h1{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:700; font-size:clamp(26px,4vw,34px); margin:0; }
  .stats{ display:flex; gap:18px; font-family:"IBM Plex Mono", monospace; font-size:13px; color:var(--text-muted); }
  .stats b{ color:var(--text); font-size:16px; display:block; font-weight:600; }

  .tabs{ display:flex; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:4px; width:max-content; margin-bottom:16px; }
  .tab{ border:none; background:transparent; color:var(--text-muted); padding:8px 18px; border-radius:999px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s,color .15s; }
  .tab[aria-selected="true"]{ background:var(--accent); color:var(--accent-contrast); }
  .tab:not([aria-selected="true"]):hover{ color:var(--text); }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:22px; }
  .controls input[type="search"]{
    flex:1 1 220px; background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 14px; border-radius:10px; font-size:14px;
  }
  .controls select{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:10px 12px; border-radius:10px; font-size:14px; max-width:180px;
  }
  .icon-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:9px 14px; border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .controls label.chk{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text-muted); white-space:nowrap; }

  .stage{ min-height:360px; }

  /* Flashcard */
  .card-nav-row{ display:flex; justify-content:center; align-items:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
  .card-wrap{ perspective:1600px; max-width:560px; margin:0 auto; }
  .flashcard{
    position:relative; min-height:320px; border-radius:18px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .flashcard.flipped{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow);
    padding:26px 26px 20px; display:flex; flex-direction:column;
  }
  .face.back{ transform:rotateY(180deg); }
  .face::before{
    content:""; position:absolute; left:-9px; top:50%; width:18px; height:18px; border-radius:50%;
    background:var(--bg); border:1px solid var(--border); transform:translateY(-50%);
  }
  .face::after{
    content:""; position:absolute; right:-9px; top:50%; width:18px; height:18px; border-radius:50%;
    background:var(--bg); border:1px solid var(--border); transform:translateY(-50%);
  }
  .face-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .chip{ font-family:"IBM Plex Mono", monospace; font-size:11px; letter-spacing:.06em; padding:4px 10px; border-radius:999px; text-transform:uppercase; }
  .chip.cat{ background:var(--gold-soft); color:var(--gold); }
  .chip.pos{ background:var(--accent-soft); color:var(--accent); }
  .word-block{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:18px 0; }
  .word{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:700; font-size:clamp(30px,5vw,42px); margin:0; }
  .ipa{ color:var(--accent); font-size:16px; }
  .speak-row{ display:flex; gap:10px; align-items:center; justify-content:center; }
  .speak-btn{
    background:var(--accent-soft); color:var(--accent); border:none; width:42px; height:42px; border-radius:50%;
    font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .12s;
  }
  .speak-btn:hover{ transform:scale(1.08); }
  .speak-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .hint{ text-align:center; font-size:12px; color:var(--text-muted); margin-top:auto; }
  .meaning{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-size:26px; font-weight:700; text-align:center; margin:6px 0 14px; }
  .example{ background:var(--surface-2); border-radius:12px; padding:14px 16px; font-size:14px; line-height:1.6; color:var(--text); display:flex; gap:10px; align-items:flex-start; }
  .example .txt{ font-style:italic; }
  .example .txt-zh{ color:var(--text-muted); font-style:normal; margin-top:4px; }

  .nav-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    width:44px; height:44px; border-radius:50%; font-size:16px; cursor:pointer;
  }
  .nav-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .mark-row{ display:flex; justify-content:center; gap:10px; margin-top:16px; }
  .mark-btn{ border:1px solid var(--border); background:var(--surface); padding:9px 16px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; color:var(--text-muted); }
  .mark-btn.unknown.active{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .mark-btn.known.active{ background:var(--success-soft); border-color:var(--success); color:var(--success); }

  .progress-bar{ height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin-top:22px; max-width:560px; margin-left:auto; margin-right:auto; }
  .progress-fill{ height:100%; background:var(--success); border-radius:999px; transition:width .3s; }

  /* List */
  .list{ display:flex; flex-direction:column; gap:8px; }
  .row{
    display:grid; grid-template-columns:1fr auto auto 44px; gap:14px; align-items:start;
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 16px;
  }
  .row .w{ font-family:"IBM Plex Sans", system-ui, sans-serif; font-weight:600; font-size:17px; }
  .row .ipa{ font-size:13px; margin-left:8px; }
  .row .meaning-inline{ color:var(--text-muted); font-size:13px; margin-top:2px; }
  .row .example-inline{ font-size:12.5px; margin-top:6px; line-height:1.5; }
  .row .example-inline .en{ font-style:italic; color:var(--text-muted); }
  .row .example-inline .zh{ color:var(--text-muted); }
  .row .cat-badge{ font-size:11px; color:var(--gold); font-family:"IBM Plex Mono",monospace; white-space:nowrap; padding-top:2px; }
  .row .speak-btn{ width:36px; height:36px; font-size:15px; }
  .empty-state{ text-align:center; color:var(--text-muted); padding:60px 20px; font-size:14px; }
  .load-more-wrap{ display:flex; justify-content:center; padding:18px 0 6px; }
  .list-count{ text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:10px; font-family:"IBM Plex Mono",monospace; }

  /* Quiz */
  .quiz-card{ max-width:560px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:30px; text-align:center; }
  .quiz-score{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:14px; }
  .quiz-options{ display:grid; gap:10px; margin-top:22px; }
  .opt-btn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:13px 16px;
    border-radius:10px; font-size:15px; cursor:pointer; text-align:left; transition:background .12s,border-color .12s;
  }
  .opt-btn:hover:not(:disabled){ border-color:var(--accent); }
  .opt-btn.correct{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .opt-btn.wrong{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .opt-btn:disabled{ cursor:default; }
  .quiz-next{ margin-top:20px; }

  /* Reading */
  .reading-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .reading-tag{ display:flex; gap:8px; align-items:center; }
  .reading-nav{ display:flex; gap:8px; align-items:center; font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text-muted); }
  .reading-layout{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:760px){ .reading-layout{ grid-template-columns:1fr; } }
  .doc-tabs{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .doc-tab{ border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); padding:6px 14px; border-radius:8px 8px 0 0; font-size:13px; font-weight:600; cursor:pointer; }
  .doc-tab[aria-selected="true"]{ background:var(--surface); color:var(--accent); border-bottom-color:var(--surface); }
  .doc-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:22px 24px; }
  .doc-title{ font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  .doc-meta{ display:flex; flex-direction:column; gap:2px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px dashed var(--border); font-size:13.5px; }
  .doc-meta .row2{ display:flex; gap:6px; }
  .doc-meta .row2 .label{ color:var(--text-muted); min-width:60px; }
  .doc-para{ margin:0 0 12px; line-height:1.75; font-size:14.5px; white-space:pre-line; }
  .doc-para:last-child{ margin-bottom:0; }
  .doc-table-wrap{ overflow-x:auto; margin-top:10px; }
  .doc-table{ border-collapse:collapse; width:100%; font-size:13.5px; }
  .doc-table th, .doc-table td{ border:1px solid var(--border); padding:7px 10px; text-align:left; white-space:nowrap; }
  .doc-table th{ background:var(--surface-2); color:var(--text-muted); font-weight:600; }
  .questions-col{ display:flex; flex-direction:column; gap:16px; }
  .q-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .q-head{ font-weight:600; font-size:14.5px; margin-bottom:2px; }
  .q-opt{ display:block; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:8px; font-size:13.5px; cursor:pointer; margin-bottom:7px; }
  .q-opt:last-child{ margin-bottom:0; }
  .q-opt[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); }
  .q-opt.correct{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .q-opt.wrong{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .q-opt:disabled{ cursor:default; }
  .q-explain{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; color:var(--text-muted); line-height:1.6; }
  .reading-actions{ display:flex; justify-content:center; gap:10px; margin-top:20px; }
  .reading-score{ text-align:center; font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text-muted); margin-top:14px; }

  footer.note{ text-align:center; color:var(--text-muted); font-size:12px; margin-top:36px; }

  @media (prefers-reduced-motion: reduce){
    .flashcard, .speak-btn, .progress-fill{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <span class="kicker">TOEIC Core Vocabulary</span>
      <h1>多益單字通</h1>
    </div>
    <div class="stats">
      <div><b id="statTotal">0</b>總字數</div>
      <div><b id="statKnown">0</b>已熟記</div>
      <div><b id="statUnknown">0</b>待複習</div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" data-mode="card" role="tab" aria-selected="true">字卡模式</button>
    <button class="tab" data-mode="list" role="tab" aria-selected="false">單字列表</button>
    <button class="tab" data-mode="quiz" role="tab" aria-selected="false">小測驗</button>
    <button class="tab" data-mode="reading" role="tab" aria-selected="false">閱讀練習</button>
  </div>

  <div class="controls" id="vocabControls">
    <input type="search" id="searchInput" placeholder="搜尋單字或中文意思…">
    <select id="categorySelect"></select>
    <label class="chk"><input type="checkbox" id="onlyUnknown"> 只看待複習</label>
    <button class="icon-btn" id="shuffleBtn">🔀 隨機排序</button>
    <button class="icon-btn" id="resetBtn">↺ 重設進度</button>
  </div>

  <div class="controls" id="readingControls" style="display:none;">
    <select id="readingTypeSelect">
      <option value="all">全部題型</option>
      <option value="single">單篇文章</option>
      <option value="double">雙篇文章</option>
      <option value="triple">三篇文章</option>
    </select>
    <select id="readingCategorySelect">
      <option value="all">全部類型</option>
      <option value="correspondence">商業書信</option>
      <option value="advertisement">廣告／徵才</option>
      <option value="notice">公告／新聞稿</option>
      <option value="form">表單／單據</option>
    </select>
    <button class="icon-btn" id="readingShuffleBtn">🔀 隨機排序</button>
  </div>

  <div class="stage" id="stage"></div>

  <footer class="note">進度儲存在此瀏覽器（localStorage），換裝置或清除瀏覽器資料會重新開始。發音使用瀏覽器內建的 Web Speech API。</footer>
</div>

<script>
/* ---------- Data ---------- */
const CATEGORY_LABELS = {
  office:"辦公室", meetings:"會議行程", correspondence:"商業書信", email:"商業書信",
  contracts:"合約法律", hr:"人力資源", finance:"財務會計", banking:"銀行金融",
  marketing:"行銷業務", advertising:"廣告", manufacturing:"製造生產", logistics:"物流運輸",
  travel:"旅遊交通", hospitality:"飯店餐飲活動", technology:"科技資訊",
  customer_service:"客戶服務", real_estate:"不動產設施", insurance:"保險",
  verbs_general:"常考動詞", adjectives_general:"常考形容詞副詞", media:"媒體出版",
  health_wellness:"健康保健", education_training:"教育訓練",
  government_public:"公家機關法規", environment_sustainability:"環保永續"
};
function categoryLabel(cat){ return CATEGORY_LABELS[cat] || cat; }

/* Tiny fallback set — only used if data/toeic_vocab.json fails to load. */
const FALLBACK_VOCAB = [
  {word:"accommodate", ipa:"/əˈkɑːmədeɪt/", pos:"v.", meaning_zh:"容納；配合(需求)", example_en:"The hotel can accommodate up to three hundred guests.", example_zh:"這間飯店最多可以容納三百位房客。", category:"hospitality"},
  {word:"agenda", ipa:"/əˈdʒendə/", pos:"n.", meaning_zh:"議程", example_en:"Please review the agenda before tomorrow's meeting.", example_zh:"請在明天開會前先看過議程。", category:"meetings"},
  {word:"invoice", ipa:"/ˈɪnvɔɪs/", pos:"n.", meaning_zh:"發票；請款單", example_en:"The invoice must be paid within thirty days.", example_zh:"這張請款單必須在三十天內付清。", category:"finance"}
];

const READING_TYPE_LABELS = {single:"單篇文章", double:"雙篇文章", triple:"三篇文章"};
const READING_CATEGORY_LABELS = {correspondence:"商業書信", advertisement:"廣告／徵才", notice:"公告／新聞稿", form:"表單／單據"};

/* Tiny fallback set — only used if data/toeic_reading.json fails to load. */
const FALLBACK_READING = [
  {
    id:0, type:"single", category:"correspondence",
    passages:[{ kind:"email", title:"E-mail",
      meta:[{label:"From:",value:"j.chen@brightway-logistics.com"},{label:"To:",value:"customer.service@parkviewhotel.com"},{label:"Subject:",value:"Delayed Shipment Inquiry"},{label:"Date:",value:"March 4"}],
      paragraphs:["Dear Customer Service Team,","I am writing to ask about the status of my recent order (#4482), which was supposed to arrive on March 1 but has not yet been delivered.","Please let me know the expected delivery date at your earliest convenience.","Sincerely,\nJ. Chen"],
      table:null }],
    questions:[
      {question_en:"Why did Mr. Chen write the e-mail?", question_zh:"陳先生為什麼寫這封信？", options:["To cancel an order","To ask about a delayed delivery","To request a refund","To complain about a product's quality"], answer_index:1, explanation_zh:"信件開頭就說明是詢問訂單 #4482 延遲送達的狀況，所以答案是 (B)。"}
    ]
  }
];

/* ---------- State ---------- */
let words = [];
let order = [];
let cursor = 0;
let mode = "card";
let flipped = false;
let progress = loadProgress();
let quizWord = null;
let quizLocked = false;

let readingSets = [];
let readingOrder = [];
let readingIdx = 0;
let readingDocTab = {};
let readingAnswers = {};
let readingChecked = {};

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem("toeic-vocab-progress")||"{}"); }catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem("toeic-vocab-progress", JSON.stringify(progress)); }catch(e){}
}
function statusOf(id){ return progress[id] || null; }
function setStatus(id, status){
  if(progress[id] === status){ delete progress[id]; }
  else{ progress[id] = status; }
  saveProgress();
  renderStats();
}

/* ---------- Speech ---------- */
const canSpeak = "speechSynthesis" in window;
function speak(text){
  if(!canSpeak) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

/* ---------- Filtering ---------- */
function currentFilterList(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const cat = document.getElementById("categorySelect").value;
  const onlyUnknown = document.getElementById("onlyUnknown").checked;
  return words.filter(w=>{
    if(cat !== "all" && w.category !== cat) return false;
    if(onlyUnknown && statusOf(w.id) === "known") return false;
    if(q && !(w.word.toLowerCase().includes(q) || w.meaning_zh.includes(q))) return false;
    return true;
  });
}

/* ---------- Setup controls ---------- */
function populateCategories(){
  const sel = document.getElementById("categorySelect");
  const cats = Array.from(new Set(words.map(w=>w.category))).sort();
  sel.innerHTML = `<option value="all">全部分類</option>` + cats.map(c=>`<option value="${c}">${categoryLabel(c)}</option>`).join("");
}

document.getElementById("searchInput").addEventListener("input", ()=>{ cursor=0; listPage=1; render(); });
document.getElementById("categorySelect").addEventListener("change", ()=>{ cursor=0; listPage=1; render(); });
document.getElementById("onlyUnknown").addEventListener("change", ()=>{ cursor=0; listPage=1; render(); });
document.getElementById("shuffleBtn").addEventListener("click", ()=>{
  const list = currentFilterList();
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  order = list.map(w=>w.id);
  cursor = 0; flipped = false;
  renderStage();
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("確定要清除所有熟記進度嗎？此動作無法復原。")){
    progress = {};
    saveProgress();
    render();
  }
});
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    mode = btn.dataset.mode;
    document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b===btn?"true":"false"));
    cursor = 0; flipped = false; listPage = 1;
    if(mode === "quiz") quizWord = null;
    document.getElementById("vocabControls").style.display = mode === "reading" ? "none" : "flex";
    document.getElementById("readingControls").style.display = mode === "reading" ? "flex" : "none";
    renderStage();
  });
});

function readingFilterList(){
  const type = document.getElementById("readingTypeSelect").value;
  const cat = document.getElementById("readingCategorySelect").value;
  return readingSets.filter(s=>{
    if(type !== "all" && s.type !== type) return false;
    if(cat !== "all" && s.category !== cat) return false;
    return true;
  });
}
document.getElementById("readingTypeSelect").addEventListener("change", ()=>{ readingIdx = 0; renderStage(); });
document.getElementById("readingCategorySelect").addEventListener("change", ()=>{ readingIdx = 0; renderStage(); });
document.getElementById("readingShuffleBtn").addEventListener("click", ()=>{
  const list = readingFilterList();
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  readingOrder = list.map(s=>s.id);
  readingIdx = 0;
  renderStage();
});

/* ---------- Render: stats ---------- */
function renderStats(){
  const total = words.length;
  const known = Object.values(progress).filter(v=>v==="known").length;
  const unknown = Object.values(progress).filter(v=>v==="unknown").length;
  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = known;
  document.getElementById("statUnknown").textContent = unknown;
}

/* ---------- Render: card mode ---------- */
function renderCardMode(container){
  const list = currentFilterList();
  const filteredOrder = order.filter(id=>list.some(w=>w.id===id));
  const finalList = filteredOrder.length ? filteredOrder : list.map(w=>w.id);
  if(finalList.length === 0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的單字，試著調整搜尋或分類。</div>`;
    return;
  }
  if(cursor >= finalList.length) cursor = 0;
  const w = words.find(x=>x.id===finalList[cursor]);
  const st = statusOf(w.id);

  container.innerHTML = `
    <div class="card-wrap">
      <div class="flashcard ${flipped?'flipped':''}" id="flashcard">
        <div class="face front">
          <div class="face-top">
            <span class="chip cat">${categoryLabel(w.category)}</span>
            <span class="chip pos">${w.pos}</span>
          </div>
          <div class="word-block">
            <p class="word">${w.word}</p>
            <p class="ipa mono">${w.ipa}</p>
            <div class="speak-row">
              <button class="speak-btn" id="speakWordBtn" title="播放發音" ${canSpeak?'':'disabled'}>🔊</button>
            </div>
          </div>
          <p class="hint">${canSpeak?'':'（此瀏覽器不支援語音播放）'} 點卡片查看中文意思</p>
        </div>
        <div class="face back">
          <div class="face-top">
            <span class="chip cat">${categoryLabel(w.category)}</span>
            <span class="chip pos">${w.pos}</span>
          </div>
          <p class="meaning">${w.meaning_zh}</p>
          <div class="example">
            <button class="speak-btn" id="speakExampleBtn" style="width:32px;height:32px;font-size:14px;flex:none;" title="播放例句" ${canSpeak?'':'disabled'}>🔊</button>
            <div>
              <div class="txt">${w.example_en}</div>
              ${w.example_zh ? `<div class="txt-zh">${w.example_zh}</div>` : ''}
            </div>
          </div>
          <p class="hint">再點一次回到正面</p>
        </div>
      </div>
    </div>
    <div class="mark-row">
      <button class="mark-btn unknown ${st==='unknown'?'active':''}" id="markUnknownBtn">❌ 還不熟</button>
      <button class="mark-btn known ${st==='known'?'active':''}" id="markKnownBtn">✅ 已熟記</button>
    </div>
    <div class="card-nav-row">
      <button class="nav-btn" id="prevBtn" title="上一個">◀</button>
      <span class="mono" style="color:var(--text-muted);font-size:13px;">${cursor+1} / ${finalList.length}</span>
      <button class="nav-btn" id="nextBtn" title="下一個">▶</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${((cursor+1)/finalList.length*100).toFixed(1)}%"></div></div>
  `;

  document.getElementById("flashcard").addEventListener("click", ()=>{ flipped = !flipped; renderStage(); });
  const sb = document.getElementById("speakWordBtn");
  if(sb) sb.addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.word); });
  const seb = document.getElementById("speakExampleBtn");
  if(seb) seb.addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.example_en); });
  document.getElementById("markUnknownBtn").addEventListener("click", (e)=>{ e.stopPropagation(); setStatus(w.id, "unknown"); renderStage(); });
  document.getElementById("markKnownBtn").addEventListener("click", (e)=>{ e.stopPropagation(); setStatus(w.id, "known"); renderStage(); });
  document.getElementById("prevBtn").addEventListener("click", ()=>{ cursor = (cursor-1+finalList.length)%finalList.length; flipped=false; renderStage(); });
  document.getElementById("nextBtn").addEventListener("click", ()=>{ cursor = (cursor+1)%finalList.length; flipped=false; renderStage(); });
}

/* ---------- Render: list mode ---------- */
const LIST_PAGE_SIZE = 100;
let listPage = 1;

function renderListMode(container){
  const list = currentFilterList();
  if(list.length === 0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的單字，試著調整搜尋或分類。</div>`;
    return;
  }
  const visibleCount = Math.min(list.length, listPage * LIST_PAGE_SIZE);
  const visible = list.slice(0, visibleCount);

  container.innerHTML = `
    <div class="list-count">顯示 ${visibleCount} / ${list.length} 筆</div>
    <div class="list">` + visible.map(w=>{
    const st = statusOf(w.id);
    return `
      <div class="row" data-id="${w.id}">
        <div>
          <span class="w">${w.word}</span>
          <span class="ipa mono">${w.ipa}</span>
          <div class="meaning-inline">${w.pos} ${w.meaning_zh}</div>
          ${w.example_en ? `<div class="example-inline"><div class="en">${w.example_en}</div>${w.example_zh ? `<div class="zh">${w.example_zh}</div>` : ''}</div>` : ''}
        </div>
        <div class="cat-badge">${categoryLabel(w.category)}</div>
        <div>
          ${st==='known' ? '<span class="chip pos" style="background:var(--success-soft);color:var(--success);">熟記</span>' : st==='unknown' ? '<span class="chip pos" style="background:var(--danger-soft);color:var(--danger);">待複習</span>' : ''}
        </div>
        <button class="speak-btn" data-word="${encodeURIComponent(w.word)}" ${canSpeak?'':'disabled'} title="播放發音">🔊</button>
      </div>
    `;
  }).join("") + `</div>` + (visibleCount < list.length ? `<div class="load-more-wrap"><button class="icon-btn" id="loadMoreBtn">載入更多（還有 ${list.length - visibleCount} 筆）</button></div>` : '');

  container.querySelectorAll(".speak-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> speak(decodeURIComponent(btn.dataset.word)));
  });
  document.getElementById("loadMoreBtn")?.addEventListener("click", ()=>{
    listPage++;
    renderStage();
  });
}

/* ---------- Render: quiz mode ---------- */
function pickQuizWord(){
  const list = currentFilterList();
  const pool = list.length >= 4 ? list : words;
  quizWord = pool[Math.floor(Math.random()*pool.length)];
  const distractorsPool = words.filter(w=>w.id !== quizWord.id);
  const distractors = [];
  const shuffled = distractorsPool.slice().sort(()=>Math.random()-0.5);
  for(const w of shuffled){
    if(distractors.length >= 3) break;
    if(w.meaning_zh !== quizWord.meaning_zh) distractors.push(w);
  }
  const options = [quizWord, ...distractors].sort(()=>Math.random()-0.5);
  quizWord.options = options;
  quizLocked = false;
}

let quizScore = {correct:0, total:0};

function renderQuizMode(container){
  if(!quizWord) pickQuizWord();
  const w = quizWord;
  container.innerHTML = `
    <div class="quiz-score mono">本次測驗　答對 ${quizScore.correct} / ${quizScore.total}</div>
    <div class="quiz-card">
      <span class="chip pos">${w.pos}</span>
      <div class="word-block" style="padding-top:10px;">
        <p class="word">${w.word}</p>
        <p class="ipa mono">${w.ipa}</p>
        <div class="speak-row">
          <button class="speak-btn" id="quizSpeakBtn" ${canSpeak?'':'disabled'} title="播放發音">🔊</button>
        </div>
      </div>
      <p style="color:var(--text-muted);font-size:13px;margin:0;">這個字的中文意思是？</p>
      <div class="quiz-options">
        ${w.options.map((o,i)=>`<button class="opt-btn" data-idx="${i}">${o.meaning_zh}</button>`).join("")}
      </div>
      <div class="quiz-next" id="quizNextWrap" style="display:none;">
        <button class="icon-btn" id="quizNextBtn">下一題 ▶</button>
      </div>
    </div>
  `;
  document.getElementById("quizSpeakBtn")?.addEventListener("click", ()=> speak(w.word));
  container.querySelectorAll(".opt-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(quizLocked) return;
      quizLocked = true;
      const idx = Number(btn.dataset.idx);
      const chosen = w.options[idx];
      const isCorrect = chosen.id === w.id;
      quizScore.total++;
      if(isCorrect) quizScore.correct++;
      container.querySelectorAll(".opt-btn").forEach((b,i)=>{
        b.disabled = true;
        if(w.options[i].id === w.id) b.classList.add("correct");
        else if(i === idx) b.classList.add("wrong");
      });
      document.getElementById("quizNextWrap").style.display = "block";
      document.querySelector(".quiz-score").textContent = `本次測驗　答對 ${quizScore.correct} / ${quizScore.total}`;
    });
  });
  document.getElementById("quizNextBtn")?.addEventListener("click", ()=>{
    pickQuizWord();
    renderStage();
  });
}

/* ---------- Render: reading mode ---------- */
function docLabel(kind){
  return {email:"E-mail", memo:"Memo", letter:"Letter", ad:"Advertisement", notice:"Notice", article:"Article", form:"Form"}[kind] || kind;
}
function renderDoc(doc){
  const metaHtml = (doc.meta && doc.meta.length) ? `<div class="doc-meta">${doc.meta.map(m=>`<div class="row2"><span class="label">${m.label}</span><span>${m.value}</span></div>`).join("")}</div>` : "";
  const parasHtml = (doc.paragraphs && doc.paragraphs.length) ? doc.paragraphs.map(p=>`<p class="doc-para">${p}</p>`).join("") : "";
  const tableHtml = doc.table ? `<div class="doc-table-wrap"><table class="doc-table"><thead><tr>${doc.table.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${doc.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="doc-title">${doc.title || docLabel(doc.kind)}</div>${metaHtml}${parasHtml}${tableHtml}`;
}

function renderReadingMode(container){
  if(readingSets.length === 0){
    container.innerHTML = `<div class="empty-state">正在載入閱讀文章…</div>`;
    return;
  }
  const list = readingFilterList();
  const filteredOrder = readingOrder.filter(id=>list.some(s=>s.id===id));
  const finalList = filteredOrder.length ? filteredOrder : list.map(s=>s.id);
  if(finalList.length === 0){
    container.innerHTML = `<div class="empty-state">找不到符合條件的文章，試著調整篩選條件。</div>`;
    return;
  }
  if(readingIdx >= finalList.length) readingIdx = 0;
  const set = readingSets.find(s=>s.id===finalList[readingIdx]);
  const activeDocIdx = readingDocTab[set.id] ?? 0;
  const answers = readingAnswers[set.id] || {};
  const checked = !!readingChecked[set.id];

  const docTabsHtml = set.passages.length > 1
    ? `<div class="doc-tabs">${set.passages.map((d,i)=>`<button class="doc-tab" data-doc="${i}" aria-selected="${i===activeDocIdx}">${d.title || docLabel(d.kind)}</button>`).join("")}</div>`
    : "";

  let correctCount = 0;
  const questionsHtml = set.questions.map((q,qi)=>{
    const chosen = answers[qi];
    const showResult = checked && chosen !== undefined;
    if(showResult && chosen === q.answer_index) correctCount++;
    const optsHtml = q.options.map((opt,oi)=>{
      let cls = "q-opt";
      if(checked){
        if(oi === q.answer_index) cls += " correct";
        else if(oi === chosen) cls += " wrong";
      }
      return `<button class="${cls}" data-qi="${qi}" data-oi="${oi}" aria-pressed="${chosen===oi}" ${checked?'disabled':''}>${String.fromCharCode(65+oi)}. ${opt}</button>`;
    }).join("");
    const explainHtml = (checked && chosen !== undefined) ? `<div class="q-explain">${chosen===q.answer_index ? '✅ 答對了！' : '❌ 答錯了。'} 正確答案是 (${String.fromCharCode(65+q.answer_index)})。<br>${q.question_zh ? `題目：${q.question_zh}<br>` : ""}${q.explanation_zh}</div>` : "";
    return `
      <div class="q-card">
        <div class="q-head">${qi+1}. ${q.question_en}</div>
        ${optsHtml}
        ${explainHtml}
      </div>
    `;
  }).join("");

  const answeredCount = Object.keys(answers).length;

  container.innerHTML = `
    <div class="reading-head">
      <div class="reading-tag">
        <span class="chip cat">${READING_TYPE_LABELS[set.type]}</span>
        <span class="chip pos">${READING_CATEGORY_LABELS[set.category] || set.category}</span>
      </div>
      <div class="reading-nav">
        <button class="nav-btn" id="readingPrevBtn" title="上一篇" style="width:36px;height:36px;">◀</button>
        <span>${readingIdx+1} / ${finalList.length}</span>
        <button class="nav-btn" id="readingNextBtn" title="下一篇" style="width:36px;height:36px;">▶</button>
      </div>
    </div>
    <div class="reading-layout">
      <div>
        ${docTabsHtml}
        <div class="doc-card">${renderDoc(set.passages[activeDocIdx])}</div>
      </div>
      <div class="questions-col">${questionsHtml}</div>
    </div>
    <div class="reading-actions">
      ${!checked ? `<button class="icon-btn" id="checkAnswersBtn" ${answeredCount===0?'disabled':''}>提交答案（已作答 ${answeredCount}/${set.questions.length}）</button>` : `<button class="icon-btn" id="retryBtn">🔄 重新作答</button>`}
    </div>
    ${checked ? `<div class="reading-score">本篇答對 ${correctCount} / ${set.questions.length} 題</div>` : ""}
  `;

  container.querySelectorAll(".doc-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{ readingDocTab[set.id] = Number(btn.dataset.doc); renderStage(); });
  });
  if(!checked){
    container.querySelectorAll(".q-opt").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const qi = Number(btn.dataset.qi), oi = Number(btn.dataset.oi);
        if(!readingAnswers[set.id]) readingAnswers[set.id] = {};
        readingAnswers[set.id][qi] = oi;
        renderStage();
      });
    });
  }
  document.getElementById("checkAnswersBtn")?.addEventListener("click", ()=>{
    readingChecked[set.id] = true;
    renderStage();
  });
  document.getElementById("retryBtn")?.addEventListener("click", ()=>{
    readingChecked[set.id] = false;
    readingAnswers[set.id] = {};
    renderStage();
  });
  document.getElementById("readingPrevBtn").addEventListener("click", ()=>{
    readingIdx = (readingIdx-1+finalList.length)%finalList.length;
    renderStage();
  });
  document.getElementById("readingNextBtn").addEventListener("click", ()=>{
    readingIdx = (readingIdx+1)%finalList.length;
    renderStage();
  });
}

/* ---------- Master render ---------- */
function renderStage(){
  const container = document.getElementById("stage");
  if(mode === "card") renderCardMode(container);
  else if(mode === "list") renderListMode(container);
  else if(mode === "reading") renderReadingMode(container);
  else renderQuizMode(container);
}
function render(){
  renderStats();
  renderStage();
}

/* ---------- Load data ---------- */
async function loadVocab(){
  const stage = document.getElementById("stage");
  stage.innerHTML = `<div class="empty-state">正在載入單字資料…</div>`;
  try{
    const res = await fetch("data/toeic_vocab.json");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    words = data.map((w,i)=>({...w, id: w.id ?? i}));
  }catch(err){
    words = FALLBACK_VOCAB.map((w,i)=>({...w, id:i}));
    stage.innerHTML = `<div class="empty-state">找不到 data/toeic_vocab.json，暫時顯示少量範例單字。<br>（若是直接雙擊開啟 index.html，瀏覽器會擋掉本機檔案讀取，請改用網站連結或本機伺服器開啟。）</div>`;
  }
  order = words.map(w=>w.id);
  populateCategories();
  render();
}

async function loadReading(){
  try{
    const res = await fetch("data/toeic_reading.json");
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    readingSets = data.map((s,i)=>({...s, id: s.id ?? i}));
  }catch(err){
    readingSets = FALLBACK_READING;
  }
  readingOrder = readingSets.map(s=>s.id);
  if(mode === "reading") renderStage();
}

loadVocab();
loadReading();
</script>
